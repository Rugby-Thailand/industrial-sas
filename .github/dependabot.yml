# Dependency update policy.
#
# GitHub Actions: weekly version updates keep the full-SHA pins current.
# Dependabot rewrites both the SHA and the trailing version comment.
#
# npm (decision D-29): routine versions are pinned and reviewed by hand, so
# `open-pull-requests-limit: 0` disables version-update PRs. Security updates
# are still raised for vulnerable dependencies once "Dependabot security
# updates" is enabled in repository settings; they arrive as normal PRs that
# need code-owner review and keep exact pins (`versioning-strategy: increase`
# never widens a range because every specifier is exact).
# https://docs.github.com/en/code-security/how-tos/secure-your-supply-chain/secure-your-dependencies/configure-security-updates
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/setup-node-pnpm"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels:
      - ci
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directories:
      - "/"
      - "/tools/release"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    versioning-strategy: increase
    commit-message:
      prefix: "deps(security)"
    labels:
      - dependencies
      - security
