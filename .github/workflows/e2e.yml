# Playwright end-to-end scaffold, kept separate from `quality.yml` because it is
# the only job that needs a browser and system libraries.
#
# Credential-free by design: `pnpm test:e2e` runs scripts/run-e2e.mjs, which
# prepares and owns both servers itself — a production build served by
# `next start` on port 3100 and a preview `next dev` it starts, warms serially,
# and stops on 3101 — and needs no accounts, secrets, or cloud services. That preparation is also what keeps the suite deterministic;
# the script's header records the two races it removes.
# Actions are pinned to immutable commit SHAs; `pnpm verify:workflows` enforces
# it and README.md records the update policy.
name: E2E

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "feat/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  playwright:
    name: Playwright (desktop + handheld Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      # Read the installed version rather than hardcoding it: the browser cache
      # key must invalidate whenever @playwright/test is bumped.
      - name: Resolve Playwright version
        id: playwright
        run: |
          version="$(node -p "require('@playwright/test/package.json').version")"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browser cache
        id: browser-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: >-
            ms-playwright-${{ runner.os }}-${{ runner.arch }}-chromium-${{
            steps.playwright.outputs.version }}

      # Chromium only. Both configured projects (desktop-chromium and
      # handheld-chromium) are Chromium; installing Firefox and WebKit would
      # download hundreds of megabytes nothing runs.
      - name: Install Chromium and system dependencies
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      # System libraries live outside the cached browser directory, so they still
      # have to be installed on a cache hit.
      - name: Install system dependencies
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Run end-to-end tests
        run: pnpm test:e2e

      # Both uploads are failure-only: the HTML report and traces are the
      # expensive, useful-when-red artifacts.
      - name: Upload Playwright HTML report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright traces and screenshots
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
