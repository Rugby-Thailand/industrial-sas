name: Setup Node and pnpm
description: >-
  Install pnpm, Node.js, this workspace's dependencies from the committed
  lockfile, and optionally the pinned Bun runtime.

inputs:
  cache:
    description: >-
      "true" restores and saves the pnpm store cache (quality jobs). Release
      jobs pass "false": trusted environments never read or write a shared
      GitHub cache.
    required: false
    default: "true"

  install-dependencies:
    description: Install the application dependencies.
    required: false
    default: "true"

  install-bun:
    description: Install the pinned Bun runtime for the Next.js and typecheck jobs.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Validate inputs
      shell: bash
      env:
        CACHE_INPUT: ${{ inputs.cache }}
        DEPENDENCIES_INPUT: ${{ inputs.install-dependencies }}
        BUN_INPUT: ${{ inputs.install-bun }}
      run: |
        case "$CACHE_INPUT" in
          true | false) ;;
          *) echo "::error::setup-node-pnpm input cache must be true or false"; exit 1 ;;
        esac
        case "$DEPENDENCIES_INPUT" in
          true | false) ;;
          *) echo "::error::setup-node-pnpm input install-dependencies must be true or false"; exit 1 ;;
        esac
        case "$BUN_INPUT" in
          true | false) ;;
          *) echo "::error::setup-node-pnpm input install-bun must be true or false"; exit 1 ;;
        esac

    # pnpm must exist before actions/setup-node runs: its `cache: pnpm` mode
    # shells out to `pnpm store path` to locate the cache directory.
    # The version is not repeated here; the action reads the exact pin from the
    # `packageManager` field in package.json (pnpm 10.33.2).
    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    # Node comes from .nvmrc (24). `engine-strict=true` in .npmrc turns a
    # mismatch against package.json `engines` into a failed install, not a
    # warning, so a wrong runner image fails loudly here.
    - name: Install Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: ${{ inputs.cache == 'true' && 'pnpm' || '' }}
        package-manager-cache: ${{ inputs.cache == 'true' }}

    - name: Install dependencies
      if: ${{ inputs.install-dependencies == 'true' }}
      shell: bash
      run: pnpm install --frozen-lockfile

    # Exact Bun from .bun-version for `pnpm typecheck` and for the Next
    # dev/build/start scripts that run under Bun. Official release archive,
    # SHA-256 pinned in the installer and verified before extraction (no
    # third-party action); it appends the binary directory to GITHUB_PATH.
    - name: Install pinned Bun
      if: ${{ inputs.install-bun == 'true' }}
      shell: bash
      run: node scripts/ci/install-bun-checker.mjs
