        function previewMarkup() {

          root.querySelectorAll("button:not([type])").forEach((button) => {
            button.type = "button";
          });

            dialog.showModal();

              event.preventDefault();
              requestClose();

              if (event.target === dialog) {
                const r = dialog.getBoundingClientRect();
                if (
                  event.clientX < r.left ||
                  event.clientX > r.right ||
                  event.clientY < r.top ||
                  event.clientY > r.bottom

              state.confirm = null;
              render();

        function refreshIcons() {

        async function saveDrafts() {

        async function copyCode(id) {

            const node =

        root.addEventListener("click", async (event) => {

          if (state.busy && action !== "theme") return;

          const draft = state.drafts.find((d) => d.key === key);

              job: item.job.trim(),

              recordState(item).identified
                ? "บันทึกข้อมูลแล้ว · รหัสพาเลทเดิม"
                : "เก็บข้อมูลแล้ว · ยังเป็น Unidentified",
            );
          } else if (action === "record-menu") {
            const record = state.records.find(
              (r) => r.id === button.dataset.id,
            );
            state.overlay = { kind: "record-menu", record };
            render();
          } else if (action === "copy") await copyCode(button.dataset.id);
          else if (action === "delete-record") {
            state.confirm = { kind: "delete-record", id: button.dataset.id };
            render();
          } else if (action === "reset") {
            if (hasDraftWork() || state.records.length) {
              state.confirm = { kind: "reset" };
              render();
            } else notify("พร้อมเริ่มทดลอง");
          } else if (action === "cancel-confirm") {
            state.confirm = null;
            render();
          } else if (action === "confirm") {
            const confirmation = state.confirm;
            if (confirmation.kind === "replace-scan") {
              const target = state.drafts.find(
                (d) => d.key === confirmation.key,
              );
              if (target) target[confirmation.field] = confirmation.code;
              state.duplicatesReviewed = false;
              closeOverlay();
              remember();
              return;
            }
            if (confirmation.kind === "discard-edit") {
              closeOverlay();
              return;
            }
            if (confirmation.kind === "remove-draft")
              state.drafts = state.drafts.filter(
                (d) => d.key !== confirmation.key,
              );
            if (confirmation.kind === "delete-record") {
              state.records = state.records.filter(
                (r) => r.id !== confirmation.id,
              );
              state.overlay = null;
            }
            if (confirmation.kind === "reset") {
              Object.assign(state, {
                screen: "draft",
                location: "F1-L3",
                drafts: [newDraft()],
                records: [],
                savedIds: [],
                sequence: 122,
                filter: "ALL",
                search: "",
                overlay: null,
                previewPhoto: null,
                duplicatesReviewed: false,
              });
            }
            state.confirm = null;
            render();
            remember();
          } else if (action === "upload" || action === "photo-new") {
            let target = draft;
            if (action === "photo-new") {
              target = state.drafts[state.drafts.length - 1];
              if (!target) {
                target = newDraft();
                state.drafts.push(target);
              }
            }
            uploadTarget = {
              key: target?.key || key,
              kind: button.dataset.kind || "draft",
            };
            const input = root.querySelector("#tg-upload");
            input.value = "";
            input.click();
          } else if (action === "remove-photo") {
            if (button.dataset.kind === "edit")
              state.overlay.draft.paperPhoto = "";
            else if (draft) draft.photo = "";
            render();
            remember();
          } else if (action === "preview-photo") {
            const record =
              button.dataset.kind === "edit" ? state.overlay.draft : draft;
            state.previewPhoto =
              button.dataset.kind === "edit" ? record.paperPhoto : record.photo;
            render();
          } else if (action === "close-preview") {
            state.previewPhoto = null;
            render();
          } else if (action === "scan-field" || action === "scan-new") {
            let target = draft;
            if (!target) {
              target = state.drafts.find((d) => !d.job || !d.barcode);
              if (!target) {
                target = newDraft();
                state.drafts.push(target);
              }
            }
            state.overlay = {
              kind: "scan",
              key: target.key,
              field: button.dataset.field || "",
              code: "",
              triggerId: `tg-${target.key}-${button.dataset.field || "job"}`,
            };
            render();
          } else if (action === "scan-sample") {
            state.overlay.code = button.dataset.value;
            root.querySelector("#tg-scan-code").value = button.dataset.value;
          } else if (action === "apply-scan") {
            const value = root.querySelector("#tg-scan-code").value.trim();
            if (!value || /^ISAS:/i.test(value)) {
              root.querySelector("#tg-scan-error").textContent =
                "ใช้รหัส Job หรือบาร์โค้ดสินค้า";
              return;
            }
            const target = state.drafts.find(
              (d) => d.key === state.overlay.key,
            );
            const field =
              state.overlay.field ||
              (/^FO\d{4,}$/i.test(value) ? "job" : "barcode");
            if (/^U\d{6,}$/.test(value)) {
              root.querySelector("#tg-scan-error").textContent =
                "รหัสนี้เป็นรหัสพาเลท ใช้ค้นหาในหน้ารายการ";
              return;
            }
            if (
              state.overlay.field &&
              (/^FO\d{4,}$/i.test(value) ? "job" : "barcode") !==
                state.overlay.field
            ) {
              root.querySelector("#tg-scan-error").textContent =
                "รหัสนี้ไม่ตรงกับช่องที่เลือก กรุณาตรวจรหัสแล้วลองอีกครั้ง";
              return;
            }
            if (value.length > (field === "job" ? 100 : 200)) {
              root.querySelector("#tg-scan-error").textContent =
                "รหัสยาวเกินขอบเขตของช่องนี้";
              return;
            }
            if (target?.[field]?.trim() && target[field].trim() !== value) {
              state.confirm = {
                kind: "replace-scan",
                key: target.key,
                field,
                code: value,
              };
              render();
              return;
            }
            if (target) target[field] = value;
            state.duplicatesReviewed = false;
            closeOverlay();
            remember();
          }
        });
        root.addEventListener("input", (event) => {
          const input = event.target;
          if (input.id === "tg-search") {
            state.search = input.value;
            root.querySelector("#tg-records-list").innerHTML = recordsList();
            refreshIcons();
            remember();
            return;
          }
          if (input.id === "tg-scan-code") {
            state.overlay.code = input.value;
            return;
          }
          if (input.id === "tg-location-value") {
            state.overlay.value = input.value;
            return;
          }
          if (!input.dataset.field) return;
          const target =
            input.dataset.scope === "edit"
              ? state.overlay?.draft
              : state.drafts.find((d) => d.key === input.dataset.key);
          if (target) {
            target[input.dataset.field] = input.value;
            if (["job", "barcode"].includes(input.dataset.field)) {
              state.duplicatesReviewed = false;
              const check = root.querySelector("#tg-duplicates-reviewed");
              if (check) check.checked = false;
            }
            updateValidity();
            remember();
          }
        });
        root.addEventListener("change", async (event) => {
          if (event.target.id === "tg-duplicates-reviewed") {
            state.duplicatesReviewed = event.target.checked;
            updateValidity();
            remember();
            return;
          }
          if (event.target.tagName === "SELECT") {
            const target = state.drafts.find(
              (d) => d.key === event.target.dataset.key,
            );
            if (target) target.format = event.target.value;
            remember();
          }
          if (event.target.id !== "tg-upload") return;
          const file = event.target.files?.[0];
          const target = uploadTarget;
          uploadTarget = null;
          if (!file || !target) return;
          if (
            !["image/jpeg", "image/png", "image/webp"].includes(file.type) ||
            file.size > 8 * 1024 * 1024
          ) {
            notify("เลือกรูป JPG, PNG หรือ WebP ขนาดไม่เกิน 8 MB");
            return;
          }
          const reader = new FileReader();
          reader.onload = () => {
            if (target.kind === "edit") {
              if (
                state.overlay?.kind !== "edit" ||
                state.overlay.draft.id !== target.key
              )
                return;
              state.overlay.draft.paperPhoto = String(reader.result);
            } else {
              const draft = state.drafts.find((d) => d.key === target.key);
              if (!draft || state.busy) return;
              draft.photo = String(reader.result);
            }
            render();
            remember();
          };
          reader.onerror = () => notify("เปิดรูปไม่ได้ กรุณาเลือกรูปอีกครั้ง");
          reader.readAsDataURL(file);
        });
        root.addEventListener("submit", (event) => {
          event.preventDefault();
          if (event.target.id === "tg-edit-form")
            root.querySelector("#tg-edit-save")?.click();
        });
        render();
      })();
    </script>
  </body>
</html>
