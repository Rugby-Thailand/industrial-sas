<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Add location preview · Storage Planner</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #fafafa;
        --surface: #fff;
        --raised: #f4f4f4;
        --text: #242424;
        --muted: #626262;
        --line: #e2e2e2;
        --input: #858585;
        --primary: #213ee8;
        --link: #213ee8;
        --success: #11643f;
        --success-bg: #e9f5ee;
        --warning: #825400;
        --warning-bg: #fff5de;
        --focus: #213ee8;
        --radius: 8px;
      }
      [data-theme="dark"] {
        color-scheme: dark;
        --bg: #000;
        --surface: #0c0c0c;
        --raised: #1d1d1d;
        --text: #f0f0f0;
        --muted: #b0b0b0;
        --line: #292929;
        --input: #858585;
        --primary: #2443d8;
        --link: #b0bfff;
        --success: #74d5a7;
        --success-bg: #10271d;
        --warning: #f0bd6c;
        --warning-bg: #2e2415;
        --focus: #b0bfff;
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          15px/1.55 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          "Noto Sans Thai",
          sans-serif;
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }
      button,
      a {
        touch-action: manipulation;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }
      button:focus-visible,
      a:focus-visible,
      summary:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 3px;
      }
      input:focus,
      select:focus {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }
      input,
      select {
        width: 100%;
        min-width: 0;
        min-height: 48px;
        padding: 10px 12px;
        border: 1px solid var(--input);
        border-radius: 6px;
        background: var(--surface);
        caret-color: var(--link);
      }
      input::placeholder {
        color: var(--muted);
        opacity: 1;
      }
      ::selection {
        background: var(--primary);
        color: white;
      }
      * {
        scrollbar-width: thin;
        scrollbar-color: var(--input) var(--bg);
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 28px;
        line-height: 1.25;
        letter-spacing: -0.025em;
        font-weight: 650;
      }
      h2 {
        font-size: 20px;
        line-height: 1.4;
        font-weight: 600;
      }
      h3 {
        font-size: 17px;
        line-height: 1.4;
        font-weight: 600;
      }
      p {
        max-width: 70ch;
      }
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 13px;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        overflow-wrap: anywhere;
      }
      .icon {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .btn {
        min-height: 46px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 10px 17px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--surface);
        font-weight: 550;
        line-height: 1.35;
        text-decoration: none;
      }
      .btn:hover {
        background: var(--raised);
      }
      .primary {
        background: var(--primary);
        border-color: var(--primary);
        color: #fff;
      }
      .primary:hover {
        background: #1e34bb;
        border-color: #1e34bb;
      }
      .ghost {
        border-color: transparent;
        background: transparent;
      }
      .link {
        background: transparent;
        border: 0;
        padding: 8px 0;
        min-height: 44px;
        color: var(--link);
        text-align: left;
        text-decoration: underline;
        text-underline-offset: 4px;
      }
      .icon-btn {
        width: 46px;
        padding: 10px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .spread {
        justify-content: space-between;
      }
      .wrap {
        flex-wrap: wrap;
      }
      .preview-banner {
        display: flex;
        gap: 12px;
        justify-content: space-between;
        align-items: center;
        min-height: 42px;
        padding: 4px 24px;
        border-bottom: 1px solid var(--line);
        color: var(--muted);
        font-size: 12px;
      }
      .preview-banner button {
        min-height: 32px;
        padding: 4px 10px;
        font-size: 12px;
      }
      .topbar {
        height: 66px;
        border-bottom: 1px solid var(--line);
        padding: 0 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        background: var(--surface);
      }
      .warehouse {
        min-width: 0;
        font-size: 14px;
        font-weight: 550;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .warehouse span {
        color: var(--muted);
        font-weight: 400;
      }
      .topbar select {
        width: 100px;
        min-height: 42px;
        padding: 7px 10px;
        border-color: var(--line);
      }
      .layout {
        display: grid;
        grid-template-columns: 220px minmax(0, 1fr);
      }
      .sidebar {
        padding: 30px 16px;
        border-right: 1px solid var(--line);
        min-height: calc(100vh - 108px);
      }
      .sidebar-title {
        padding: 0 12px 24px;
        font-size: 16px;
        font-weight: 650;
      }
      .nav-button {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        min-height: 48px;
        padding: 12px;
        margin-bottom: 6px;
        text-align: left;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--muted);
      }
      .nav-button:hover {
        background: var(--raised);
        color: var(--text);
      }
      .nav-button[aria-current="page"] {
        color: var(--text);
        background: var(--raised);
        font-weight: 600;
      }
      main {
        min-width: 0;
      }
      .content {
        max-width: 784px;
        padding: 40px 32px 130px;
        margin: auto;
      }
      .heading {
        margin-bottom: 28px;
      }
      .heading p {
        margin-top: 10px;
        color: var(--muted);
      }
      .steps {
        display: flex;
        align-items: center;
        gap: 16px;
        list-style: none;
        margin: 0 0 32px;
        padding: 0;
        color: var(--muted);
        font-size: 13px;
      }
      .steps li {
        display: flex;
        align-items: center;
        gap: 7px;
        white-space: nowrap;
      }
      .step-number {
        display: grid;
        place-items: center;
        width: 24px;
        height: 24px;
        border: 1px solid var(--line);
        border-radius: 50%;
        font-variant-numeric: tabular-nums;
      }
      .steps .current {
        color: var(--text);
        font-weight: 600;
      }
      .steps .current .step-number {
        border-color: var(--primary);
        color: #fff;
        background: var(--primary);
      }
      .steps .done .step-number {
        border-color: var(--success);
        color: var(--success);
      }
      .step-rule {
        height: 1px;
        flex: 1;
        background: var(--line);
      }
      .section {
        margin-bottom: 24px;
      }
      .section-heading {
        margin-bottom: 18px;
      }
      .section-heading p {
        margin-top: 6px;
      }
      .search {
        position: relative;
        display: flex;
        margin: 16px 0 22px;
      }
      .search > .icon {
        position: absolute;
        top: 14px;
        left: 13px;
        color: var(--muted);
      }
      .search input {
        padding-left: 42px;
        padding-right: 57px;
      }
      .search .scan {
        position: absolute;
        right: 1px;
        top: 1px;
        bottom: 1px;
        width: 48px;
        border: 0;
        border-left: 1px solid var(--input);
        border-radius: 0 5px 5px 0;
        background: var(--primary);
        color: #fff;
        display: grid;
        place-items: center;
      }
      .unknown {
        display: flex;
        gap: 14px;
        padding: 21px 0;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }
      .unknown > .icon {
        color: var(--warning);
        margin-top: 3px;
      }
      .unknown p {
        color: var(--muted);
        margin-top: 5px;
      }
      .unknown .btn {
        margin-top: 16px;
      }
      .fallback {
        margin-top: 9px;
      }
      .matches {
        list-style: none;
        margin: 0;
        padding: 0;
        border-block: 1px solid var(--line);
      }
      .matches li + li {
        border-top: 1px solid var(--line);
      }
      .match {
        width: 100%;
        background: transparent;
        border: 0;
        display: flex;
        gap: 12px;
        align-items: center;
        text-align: left;
        padding: 14px 8px;
        min-height: 64px;
      }
      .match:hover {
        background: var(--raised);
      }
      .match > .icon {
        color: var(--muted);
      }
      .match strong {
        display: block;
        font-size: 15px;
      }
      .match span {
        min-width: 0;
      }
      .registration {
        border-top: 1px solid var(--line);
        padding-top: 24px;
        margin-top: 22px;
      }
      .registration h2 {
        margin-bottom: 7px;
      }
      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px 18px;
        margin-top: 24px;
      }
      label {
        display: block;
        font-size: 14px;
        font-weight: 550;
        margin-bottom: 7px;
      }
      label .optional {
        font-weight: 400;
        color: var(--muted);
        margin-left: 5px;
        font-size: 12px;
      }
      .field-help {
        color: var(--muted);
        font-size: 12px;
        margin-top: 6px;
      }
      .actions {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
        margin-top: 28px;
      }
      .form-note {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 22px;
        color: var(--muted);
        font-size: 13px;
      }
      .notice {
        margin-top: 16px;
        padding: 12px 14px;
        border-radius: 6px;
        background: var(--success-bg);
        color: var(--success);
        display: flex;
        align-items: start;
        gap: 9px;
        font-size: 13px;
      }
      .error {
        color: var(--warning);
        background: var(--warning-bg);
      }
      .destination {
        border-bottom: 1px solid var(--line);
        padding-bottom: 22px;
        margin-bottom: 28px;
      }
      .destination-code {
        font-size: 19px;
        font-weight: 600;
        margin-top: 6px;
      }
      .breadcrumb {
        color: var(--muted);
        font-size: 13px;
        margin-top: 4px;
        overflow-wrap: anywhere;
      }
      .ticket {
        padding: 24px 0;
        border-bottom: 1px solid var(--line);
      }
      .ticket-top {
        margin-bottom: 14px;
      }
      .ticket-top strong {
        font-size: 15px;
      }
      .ticket .form-grid {
        margin-top: 12px;
      }
      .format-controls {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }
      .format-controls .btn {
        padding: 8px 13px;
        min-height: 42px;
        font-size: 13px;
      }
      .format-controls [aria-pressed="true"] {
        background: var(--raised);
        border-color: var(--link);
        color: var(--link);
      }
      .required-note {
        margin-top: 15px;
      }
      .save-bar {
        margin-top: 28px;
        padding-top: 0;
      }
      .save-bar .btn {
        min-width: 190px;
      }
      .receipt {
        padding: 24px 0;
      }
      .receipt-icon {
        width: 52px;
        height: 52px;
        color: var(--success);
        margin-bottom: 18px;
      }
      .receipt h2 {
        font-size: 27px;
      }
      .receipt dl {
        display: grid;
        grid-template-columns: 150px 1fr;
        gap: 14px;
        border-block: 1px solid var(--line);
        padding: 24px 0;
        margin: 26px 0;
      }
      dt {
        color: var(--muted);
      }
      dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      .records {
        list-style: none;
        padding: 0;
        margin: 26px 0;
      }
      .record {
        padding: 18px 0;
        border-bottom: 1px solid var(--line);
      }
      .record p {
        margin-top: 4px;
      }
      .status {
        display: inline-flex;
        gap: 6px;
        align-items: center;
        color: var(--success);
        font-size: 12px;
      }
      .status .icon {
        width: 15px;
        height: 15px;
      }
      .empty {
        padding: 30px 0;
        color: var(--muted);
      }
      .switcher {
        position: fixed;
        z-index: 20;
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 5px;
        border: 1px solid var(--input);
        border-radius: 9px;
        background: var(--surface);
        max-width: calc(100vw - 24px);
      }
      .switcher button {
        border: 0;
        border-radius: 5px;
        background: transparent;
        padding: 10px;
        min-height: 42px;
      }
      .switcher button:hover {
        background: var(--raised);
      }
      .switcher .variant {
        min-width: 190px;
        text-align: center;
        padding: 0 8px;
        font-size: 13px;
      }
      .variant small {
        display: block;
        font-size: 10px;
        color: var(--muted);
      }
      dialog {
        color: var(--text);
        background: var(--surface);
        border: 0;
        padding: 0;
      }
      dialog::backdrop {
        background: rgb(0 0 0 / 0.65);
      }
      #drawer {
        position: fixed;
        inset: 0 0 0 auto;
        margin: 0;
        width: min(520px, 100%);
        height: 100dvh;
        max-height: none;
        max-width: none;
        padding: 30px 28px 90px;
        overflow-y: auto;
      }
      #drawer .registration {
        border: 0;
        padding: 0;
        margin-top: 0;
      }
      #drawer .form-grid {
        grid-template-columns: 1fr;
      }
      .dialog-top {
        margin-bottom: 20px;
      }
      #state-dialog {
        width: min(660px, calc(100vw - 24px));
        border-radius: 12px;
        padding: 24px;
      }
      #state-dialog pre {
        max-height: 55vh;
        overflow: auto;
        padding: 14px;
        margin-top: 20px;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 6px;
        font-size: 12px;
      }
      .mobile-menu {
        display: none;
      }
      @media (max-width: 900px) {
        .layout {
          display: block;
        }
        .sidebar {
          display: none;
          position: absolute;
          z-index: 15;
          top: 108px;
          left: 0;
          width: 250px;
          background: var(--surface);
          border-bottom: 1px solid var(--line);
          min-height: auto;
        }
        .sidebar.open {
          display: block;
        }
        .mobile-menu {
          display: inline-flex;
        }
        .topbar {
          padding: 0 16px;
        }
        .content {
          padding-top: 30px;
        }
      }
      @media (max-width: 540px) {
        body {
          font-size: 14px;
        }
        .preview-banner {
          padding: 5px 14px;
          gap: 4px;
        }
        .preview-banner .state-trigger {
          display: none;
        }
        .topbar {
          gap: 8px;
          padding: 0 12px;
        }
        .warehouse {
          font-size: 13px;
        }
        .warehouse span {
          display: none;
        }
        .topbar .row {
          gap: 5px;
        }
        .topbar select {
          width: 75px;
          font-size: 13px;
        }
        .content {
          padding: 28px 20px 112px;
        }
        h1 {
          font-size: 25px;
        }
        h2 {
          font-size: 18px;
        }
        .steps {
          gap: 8px;
          margin-bottom: 27px;
          font-size: 11px;
        }
        .steps li {
          gap: 5px;
        }
        .step-number {
          width: 22px;
          height: 22px;
        }
        .heading {
          margin-bottom: 24px;
        }
        .form-grid {
          grid-template-columns: 1fr;
          gap: 17px;
        }
        .actions {
          flex-direction: column-reverse;
        }
        .actions .btn {
          width: 100%;
        }
        .receipt dl {
          grid-template-columns: 95px minmax(0, 1fr);
          gap: 12px;
        }
        .unknown {
          gap: 10px;
        }
        .save-bar {
          align-items: stretch;
          flex-direction: column;
        }
        .save-bar .btn {
          width: 100%;
        }
        .switcher {
          bottom: 12px;
        }
        .switcher .variant {
          min-width: 176px;
        }
        #drawer {
          padding: 22px 20px 90px;
        }
      }
      @media (prefers-reduced-motion: no-preference) {
        .registration {
          animation: reveal 0.22s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes reveal {
          from {
            clip-path: inset(0 0 18% 0);
          }
          to {
            clip-path: inset(0);
          }
        }
      }
    </style>
  </head>
  <body>
    <svg style="display: none" xmlns="http://www.w3.org/2000/svg">
      <symbol id="i-scan" viewBox="0 0 24 24">
        <path
          d="M7 3H4a1 1 0 0 0-1 1v3m14-4h3a1 1 0 0 1 1 1v3M3 17v3a1 1 0 0 0 1 1h3m10 0h3a1 1 0 0 0 1-1v-3M7 7v10m3-10v10m4-10v10m3-10v10"
        />
      </symbol>
      <symbol id="i-pin" viewBox="0 0 24 24">
        <path d="M20 10c0 6-8 11-8 11S4 16 4 10a8 8 0 0 1 16 0Z" />
        <circle cx="12" cy="10" r="2.5" />
      </symbol>
      <symbol id="i-search" viewBox="0 0 24 24">
        <circle cx="10.5" cy="10.5" r="6.5" />
        <path d="m16 16 5 5" />
      </symbol>
      <symbol id="i-plus" viewBox="0 0 24 24">
        <path d="M12 5v14M5 12h14" />
      </symbol>
      <symbol id="i-check" viewBox="0 0 24 24">
        <path d="m7 12 3 3 7-7" />
        <circle cx="12" cy="12" r="9" />
      </symbol>
      <symbol id="i-box" viewBox="0 0 24 24">
        <path d="m12 3 9 5v8l-9 5-9-5V8l9-5ZM3 8l9 5 9-5M12 13v8M7.5 5.5l9 5" />
      </symbol>
      <symbol id="i-building" viewBox="0 0 24 24">
        <path
          d="M4 21V3h12v18M16 9h4v12M2 21h20M8 7h4M8 11h4M8 15h4M9 21v-3h3v3"
        />
      </symbol>
      <symbol id="i-list" viewBox="0 0 24 24">
        <path d="M9 6h12M9 12h12M9 18h12M3 6h1M3 12h1M3 18h1" />
      </symbol>
      <symbol id="i-menu" viewBox="0 0 24 24">
        <path d="M4 6h16M4 12h16M4 18h16" />
      </symbol>
      <symbol id="i-theme" viewBox="0 0 24 24">
        <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z" />
      </symbol>
      <symbol id="i-close" viewBox="0 0 24 24">
        <path d="m6 6 12 12M6 18 18 6" />
      </symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24">
        <path d="M5 12h14m-5-5 5 5-5 5" />
      </symbol>
      <symbol id="i-left" viewBox="0 0 24 24">
        <path d="m15 5-7 7 7 7" />
      </symbol>
      <symbol id="i-right" viewBox="0 0 24 24">
        <path d="m9 5 7 7-7 7" />
      </symbol>
      <symbol id="i-trash" viewBox="0 0 24 24">
        <path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7" />
      </symbol>
    </svg>
    <div class="preview-banner">
      <span id="preview-label"></span>
      <div class="row">
        <button
          class="btn ghost state-trigger"
          data-action="state"
          id="state-label"
        ></button
        ><button
          class="btn ghost"
          data-action="reset"
          id="reset-label"
        ></button>
      </div>
    </div>
    <header class="topbar">
      <div class="row" style="min-width: 0">
        <button
          class="btn ghost icon-btn mobile-menu"
          data-action="menu"
          aria-label="Open menu"
        >
          <svg class="icon"><use href="#i-menu" /></svg>
        </button>
        <div class="warehouse">
          TG-OPT <span>· Top Gold Optimized Warehouse</span>
        </div>
      </div>
      <div class="row">
        <select id="language" aria-label="Language">
          <option value="en">English</option>
          <option value="th">ไทย</option></select
        ><button
          class="btn ghost icon-btn"
          data-action="theme"
          aria-label="Switch light and dark theme"
        >
          <svg class="icon"><use href="#i-theme" /></svg>
        </button>
      </div>
    </header>
    <div class="layout">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-title">Storage Planner</div>

      }
      function recordsScreen() {
        return `<div class="heading"><h1>${tr("recordTitle")}</h1><p>${tr("recordHint")}</p></div>${state.records.length ? `<ul class="records">${state.records.map((record) => `<li class="record"><div class="row spread wrap"><strong class="mono">${escape(record.factoryOrder)}</strong><span class="${record.location.unmapped ? "muted small" : "status"}">${icon("pin")}${tr(record.location.unmapped ? "needs" : "set")}</span></div><p class="mono small muted">${escape(record.productCode)}</p><p class="small muted">${tr(record.storageFormat)}${record.quantity !== "" ? ` · ${escape(record.quantity)}` : ""}</p><p class="mono" style="margin-top:12px">${escape(record.location.code)}</p><p class="breadcrumb">${escape(breadcrumb(record.location))}</p></li>`).join("")}</ul>` : `<p class="empty">${tr("emptyRecords")}</p>`}<button class="btn" data-action="new-scan">${icon("scan")}${tr("start")}</button>`;
      }
      function locationsScreen() {
        return `<div class="heading"><h1>${tr("locationsTitle")}</h1><p>${tr("locationsHint")}</p></div><ul class="records">${state.locations.map((l) => `<li class="record"><div class="row spread wrap"><strong class="mono">${escape(l.code)}</strong>${l.pending ? `<span class="muted small">${tr("layoutPending")}</span>` : ""}</div><p class="breadcrumb">${escape(breadcrumb(l))}</p></li>`).join("")}</ul><button class="btn" data-action="new-scan">${tr("start")}${icon("arrow")}</button>`;
      }
      function render() {
        document.documentElement.lang = lang;
        $("language").value = lang;
        $("preview-label").textContent = tr("preview");
        $("reset-label").textContent = tr("reset");
        $("state-label").textContent = tr("state");
        $("variant-label").innerHTML =
          `${tr({ A: "inline", B: "drawer", C: "step" }[variant])}<small>${tr(variant === "A" ? "recommended" : "compare")}</small>`;
        navigation();
        $("content").innerHTML =
          state.page === "records"
            ? recordsScreen()
            : state.page === "locations"
              ? locationsScreen()
              : `<div class="heading"><h1>${tr("title")}</h1><p>${tr("subtitle")}</p></div>${progress()}${state.stage === "location" ? locationScreen() : state.stage === "tickets" ? ticketScreen() : successScreen()}`;
        if (
          state.adding &&
          variant === "B" &&
          state.page === "scan" &&
          state.stage === "location"
        ) {
          $("drawer").innerHTML =
            `<div class="row spread dialog-top"><span class="muted small">${tr("newLocation")}</span><button class="btn ghost icon-btn" data-action="cancel-add" aria-label="${tr("cancel")}">${icon("close")}</button></div>${registrationForm()}`;
          if (!$("drawer").open) $("drawer").showModal();
        } else if ($("drawer").open) $("drawer").close();
        syncUrl();
      }
      function showPage(page) {
        state.page = page;
        state.adding = false;
        $("sidebar").classList.remove("open");
        render();
        window.scrollTo(0, 0);
      }
      function choose(loc, added = false) {
        state.selected = { ...loc };
        state.stage = "tickets";
        state.page = "scan";
        state.adding = false;
        state.added = added;
        state.error = "";
        render();
        window.scrollTo(0, 0);
        $("announcement").textContent = tr(added ? "added" : "set");
      }
      function switchVariant(delta) {
        const variants = ["A", "B", "C"];
        variant = variants[(variants.indexOf(variant) + delta + 3) % 3];
        render();
      }
      function addTicket(sample) {
        const index = state.tickets.length;
        state.tickets.push({
          id: crypto.randomUUID(),
          storageFormat: index % 2 ? "BOX" : "PALLET",
          factoryOrder: sample ? `FO690700${73 + index}` : "",
          productCode: sample ? "FBN-BXVMI004-BOX-00F" : "",
          quantity: sample ? "1000" : "",
        });
        state.error = "";
        render();
      }
      document.addEventListener("click", (event) => {
        const el = event.target.closest("button");
        if (!el) return;
        if (el.dataset.page) {
          showPage(el.dataset.page);
          return;
        }
        if (el.dataset.location) {
          choose(state.locations.find((l) => l.id === el.dataset.location));
          return;
        }
        if (el.dataset.remove) {
          state.tickets = state.tickets.filter(
            (i) => i.id !== el.dataset.remove,
          );
          render();
          return;
        }
        if (el.dataset.format) {
          state.tickets.find((i) => i.id === el.dataset.item).storageFormat =
            el.dataset.format;
          render();
          return;
        }
        switch (el.dataset.action) {
          case "menu":
            $("sidebar").classList.toggle("open");
            break;
          case "theme":
            document.documentElement.dataset.theme =
              document.documentElement.dataset.theme === "dark"
                ? "light"
                : "dark";
            syncUrl();
            break;
          case "reset":
            state = fresh();
            render();
            window.scrollTo(0, 0);
            break;
          case "state":
            $("state-json").textContent = JSON.stringify(
              { variant, ...state },
              null,
              2,
            );
            $("state-dialog").showModal();
            break;
          case "close-state":
            $("state-dialog").close();
            break;
          case "previous":
            switchVariant(-1);
            break;
          case "next":
            switchVariant(1);
            break;
          case "sample-location":
            state.search = "F2-L28-18";
            state.adding = false;
            const found = state.locations.find((l) => l.code === state.search);
            if (found) choose(found);
            else {
              render();
              $("announcement").textContent = tr("missing");
            }
            break;
          case "add":
            state.adding = true;
            state.error = "";
            state.registration = {
              code: state.search.trim(),
              name: "",
              building: "",
              floor: "",
            };
            render();
            if (variant === "A")
              $("registration-title").scrollIntoView({
                block: "nearest",
                behavior: "auto",
              });
            $("building").focus({ preventScroll: true });
            break;
          case "cancel-add":
            state.adding = false;
            state.error = "";
            render();
            document
              .querySelector('[data-action="add"]')
              ?.focus({ preventScroll: true });
            break;
          case "unmapped":
            choose({
              code: state.search.trim(),
              name: state.search.trim(),
              building: "",
              floor: "",
              unmapped: true,
            });
            break;
          case "change-location":
            state.stage = "location";
            state.added = false;
            state.search = state.selected.code;
            render();
            window.scrollTo(0, 0);
            break;
          case "sample-ticket":
            addTicket(true);
            break;
          case "manual":
            addTicket(false);
            break;
          case "save":
            if (
              state.tickets.some(
                (i) =>
                  !i.factoryOrder.trim() ||
                  !i.productCode.trim() ||
                  (i.quantity !== "" &&
                    (!Number.isFinite(Number(i.quantity)) ||
                      Number(i.quantity) < 0)),
              )
            ) {
              state.error = "incomplete";
              render();
              return;
            }
            state.receipt = state.tickets.map((i) => ({
              ...i,
              location: { ...state.selected },
            }));
            state.records.push(...state.receipt);
            state.tickets = [];
            state.stage = "saved";
            state.error = "";
            render();
            window.scrollTo(0, 0);
            break;
          case "more":
            state.stage = "tickets";
            state.added = false;
            state.tickets = [];
            render();
            window.scrollTo(0, 0);
            break;
          case "new-scan":
            state.page = "scan";
            state.stage = "location";
            state.adding = false;
            state.selected = null;
            state.tickets = [];
            state.search = "";
            state.error = "";
            state.added = false;
            render();
            window.scrollTo(0, 0);
            break;
        }
      });
      document.addEventListener("input", (event) => {
        const el = event.target;
        if (el.id === "search-input") {
          state.search = el.value;
          state.adding = false;
          state.error = "";
          document.querySelector(".registration")?.remove();
          $("search-results").innerHTML = searchResults();
        }
        if (el.closest("#registration-form") && el.name)
          state.registration[el.name] = el.value;
        if (el.dataset.field)
          state.tickets.find((i) => i.id === el.dataset.item)[
            el.dataset.field
          ] = el.value;
      });
      document.addEventListener("change", (event) => {
        if (event.target.id === "language") {
          lang = event.target.value;
          render();
        }
        if (event.target.id === "building") {
          state.registration.building = event.target.value;
          state.registration.floor = "";
          render();
          $("building").focus({ preventScroll: true });
        }
      });
      document.addEventListener("submit", (event) => {
        if (event.target.id !== "registration-form") return;
        event.preventDefault();
        const code = state.registration.code.trim().toUpperCase();
        if (
          !code ||
          code.length > 200 ||
          /^ISAS:/i.test(code) ||
          /[\x00-\x1f]/.test(code)
        ) {
          state.error = "invalidCode";
          render();
          return;
        }
        if (state.locations.some((l) => l.code === code)) {
          state.error = "exists";
          render();
          return;
        }
        const loc = {
          id: crypto.randomUUID(),
          code,
          name: state.registration.name.trim() || code,
          building: state.registration.building,
          floor: state.registration.floor,
          pending: true,
        };
        state.locations.push(loc);
        choose(loc, true);
      });
      $("drawer").addEventListener("cancel", (event) => {
        event.preventDefault();
        state.adding = false;
        state.error = "";
        render();
        document
          .querySelector('[data-action="add"]')
          ?.focus({ preventScroll: true });
      });
      document.addEventListener("keydown", (event) => {
        if (
          !["ArrowLeft", "ArrowRight"].includes(event.key) ||
          event.target.closest("input,select,textarea,[contenteditable],dialog")
        )
          return;
        event.preventDefault();
        switchVariant(event.key === "ArrowRight" ? 1 : -1);
      });
      render();
    </script>
  </body>
</html>
