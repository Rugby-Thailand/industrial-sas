<!doctype html>
<!-- THROWAWAY PROTOTYPE: three Storage Planner layouts, B selected; compact floor rail + mobile map/list and bottom sheet. ?variant=A|B|C remains for comparison. Sample data only. -->
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Storage Planner — B desktop & mobile</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #121615;
        --panel: #1a201e;
        --raised: #222a26;
        --border: #344039;
        --muted: #a0aea5;
        --text: #edf2eb;
        --accent: #d0ef96;
        --ink: #1c2b12;
        --green: #87bda4;
        --amber: #e5bf83;
        --red: #f3a897;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.55 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          "Noto Sans Thai",
          sans-serif;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button,
      a {
        touch-action: manipulation;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 4px;
      }
      button {
        color: inherit;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 30px;
        letter-spacing: -1px;
        font-weight: 600;
      }
      h2 {
        font-size: 17px;
        font-weight: 600;
      }
      h3 {
        font-size: 15px;
      }
      small,
      .muted {
        color: var(--muted);
      }
      .eyebrow {
        color: var(--muted);
        font-size: 10px;
        letter-spacing: 2px;
        text-transform: uppercase;
        font-weight: 700;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, monospace;
      }
      .icon {
        width: 18px;
        height: 18px;
        display: inline-block;
        flex-shrink: 0;
        vertical-align: middle;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 10px 14px;
        min-height: 42px;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 7px;
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
      }
      .btn:hover {
        background: #303b33;
        border-color: #647761;
      }
      .btn.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--ink);
      }
      .btn.ghost {
        background: transparent;
        border-color: transparent;
      }
      .btn.danger {
        color: var(--red);
      }
      .btn.compact {
        min-height: 34px;
        padding: 6px 10px;
      }
      .iconbtn {
        width: 40px;
        padding: 8px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .between {
        justify-content: space-between;
      }
      .wrap {
        flex-wrap: wrap;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        padding: 4px 9px;
        border: 1px solid var(--border);
        border-radius: 5px;
        color: var(--muted);
        white-space: nowrap;
      }
      .pill.green {
        color: #bde1ca;
        background: #283b31;
        border-color: #3b5948;
      }
      .pill.amber {
        color: var(--amber);
        background: #3a3021;
        border-color: #5b4930;
      }
      .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
      }
      .app {
        display: grid;
        grid-template-columns: 208px minmax(0, 1fr);
        min-height: 100vh;
      }
      .sidebar {
        border-right: 1px solid var(--border);
        padding: 28px 16px;
        display: flex;
        flex-direction: column;
        gap: 32px;
        background: #151b18;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 10px;
        font-size: 17px;
        font-weight: 650;
        letter-spacing: -0.5px;
      }
      .brandmark {
        width: 33px;
        height: 33px;
        background: var(--accent);
        color: var(--ink);
        border-radius: 8px;
        display: grid;
        place-items: center;
      }
      .sidebar nav {
        display: grid;
        gap: 5px;
      }
      .sidebar .navitem {
        padding: 12px 11px;
        display: flex;
        gap: 10px;
        align-items: center;
        border-radius: 7px;
        color: var(--muted);
        font-size: 12px;
      }
      .sidebar .navitem.active {
        background: #2d382a;
        color: var(--accent);
      }
      .sidebottom {
        margin-top: auto;
        padding: 20px 8px 100px;
        border-top: 1px solid var(--border);
      }
      .avatar {
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: #3a4537;
        color: var(--accent);
        font-size: 11px;
      }
      .main {
        min-width: 0;
      }
      .topbar {
        height: 66px;
        padding: 0 30px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 12px;
        gap: 12px;
      }
      .topbar .trail {
        color: var(--muted);
      }
      .topbar .trail span {
        padding: 0 10px;
        color: #627468;
      }
      .workspace {
        padding: 27px 30px 120px;
        max-width: 1850px;
        margin: auto;
      }
      .pagehead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 25px;
      }
      .pagehead h1 {
        margin: 5px 0;
      }
      .subline {
        font-size: 12px;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .subline span + span {
        border-left: 1px solid var(--border);
        padding-left: 12px;
      }
      .floorbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
        gap: 12px;
      }
      .tabs {
        display: flex;
        gap: 5px;
        background: #101612;
        border: 1px solid var(--border);
        border-radius: 7px;
        padding: 4px;
      }
      .tabs button {
        border: 0;
        background: transparent;
        border-radius: 4px;
        padding: 7px 14px;
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }
      .tabs button.active {
        background: #344332;
        color: var(--accent);
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
      }
      .panelhead {
        padding: 17px 20px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .map-panel {
        min-width: 0;
      }
      .maptools {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 12px 15px;
        background: #1d2520;
        border-bottom: 1px solid var(--border);
        flex-wrap: wrap;
      }
      .toolgroup {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .separator {
        height: 22px;
        border-left: 1px solid var(--border);
        margin: 0 5px;
      }
      .mapcanvas {
        position: relative;
        min-height: 450px;
        overflow: hidden;
        background-color: #17201b;
        background-image: radial-gradient(#3c4c3f 1px, transparent 1px);
        background-size: 20px 20px;
        display: grid;
        place-items: center;
      }
      .mapcanvas svg.plan {
        width: 100%;
        height: 450px;
        max-width: 760px;
        transition: transform 0.25s;
        transform-origin: center;
      }
      .mapcanvas.three svg.plan {
        transform: perspective(950px) rotateX(35deg) rotateZ(-18deg) scale(0.86);
      }
      .mapcanvas .mapstamp {
        position: absolute;
        top: 18px;
        left: 20px;
        pointer-events: none;
      }
      .mapstamp p {
        font-size: 11px;
        margin-top: 4px;
        color: var(--muted);
      }
      .north {
        position: absolute;
        right: 20px;
        top: 20px;
        display: grid;
        justify-items: center;
        font-size: 10px;
        color: var(--muted);
        gap: 3px;
      }
      .mapbottom {
        position: absolute;
        bottom: 16px;
        left: 20px;
        right: 20px;
        display: flex;
        justify-content: space-between;
        color: var(--muted);
        font-size: 10px;
        gap: 12px;
      }
      .legend {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      .legend span {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .swatch {
        width: 8px;
        height: 8px;
        border: 1px solid #719982;
        background: #294d3b;
        border-radius: 2px;
      }
      .swatch.empty {
        background: #29332b;
        border-color: #708468;
      }
      .swatch.reserved {
        background: #4f452e;
        border-color: #b29460;
      }
      .zone {
        cursor: pointer;
        outline: none;
      }
      .zone rect {
        fill: #29372d;
        stroke: #6b816b;
        stroke-width: 1.3;
        transition: fill 0.15s;
      }
      .zone.occupied rect {
        fill: #2b5140;
        stroke: #70a38b;
      }
      .zone:hover rect,
      .zone:focus rect {
        fill: #4a6240;
        stroke: #e0f5b9;
        stroke-width: 2;
      }
      .zone.selected rect {
        fill: #cce992;
        stroke: #efffcf;
        stroke-width: 2.5;
      }
      .zone text {
        fill: #c2d0c4;
        pointer-events: none;
        font-size: 10px;
        font-family: ui-monospace, monospace;
      }
      .zone.selected text {
        fill: #203416;
        font-weight: bold;
      }
      .zone .count {
        font-size: 8px;
        opacity: 0.75;
      }
      .split {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 300px;
        gap: 16px;
      }
      .inspector {
        display: flex;
        flex-direction: column;
      }
      .inspector .inner {
        padding: 22px;
      }
      .locationglyph {
        width: 48px;
        height: 48px;
        border: 1px solid #5f754f;
        border-radius: 9px;
        background: #2c3b26;
        color: var(--accent);
        display: grid;
        place-items: center;
        margin-bottom: 22px;
      }
      .locationglyph .icon {
        width: 25px;
        height: 25px;
      }
      .inspector h2 {
        font-size: 22px;
        letter-spacing: -0.4px;
        margin: 7px 0 3px;
      }
      .metrics {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px 14px;
        margin: 24px 0;
      }
      .metrics label {
        display: block;
        font-size: 10px;
        color: var(--muted);
        margin-bottom: 5px;
      }
      .metrics strong {
        font-size: 14px;
        font-weight: 500;
      }
      .divider {
        height: 1px;
        background: var(--border);
        margin: 20px 0;
      }
      .inventorymini {
        padding: 14px;
        background: #232e26;
        border-radius: 7px;
        margin: 15px 0;
        font-size: 12px;
      }
      .inventorymini strong {
        display: block;
        margin-bottom: 4px;
      }
      .inspectorfooter {
        margin-top: auto;
        padding: 18px 22px;
        border-top: 1px solid var(--border);
      }
      .inspectorfooter .btn {
        width: 100%;
      }
      .smallnote {
        font-size: 11px;
        line-height: 1.7;
        color: var(--muted);
        margin-top: 14px;
      }
      .inventory {
        margin-top: 20px;
      }
      .listtools {
        padding: 16px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .search {
        display: flex;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 8px 12px;
        background: #151c18;
        color: var(--muted);
        max-width: 280px;
        width: 100%;
      }
      .search input {
        border: 0;
        outline: 0;
        background: transparent;
        min-width: 0;
        width: 100%;
        color: var(--text);
        font-size: 12px;
      }
      .filter {
        background: var(--raised);
        color: var(--text);
        border: 1px solid var(--border);
        padding: 8px;
        border-radius: 6px;
        font-size: 12px;
        min-height: 37px;
      }
      .tablewrap {
        overflow: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        white-space: nowrap;
        font-size: 12px;
        text-align: left;
      }
      th {
        font-size: 10px;
        font-weight: 500;
        color: var(--muted);
        background: #1c241f;
        padding: 10px 20px;
        border-top: 1px solid var(--border);
      }
      td {
        padding: 13px 20px;
        border-top: 1px solid #2c362f;
      }
      tbody tr.selected {
        background: #2b3825;
      }
      tbody tr:hover {
        background: #2b362c;
      }
      td .locationlink {
        border: 0;
        background: transparent;
        color: var(--text);
        font: inherit;
        font-weight: 600;
        padding: 4px 0;
      }
      .tablefooter {
        padding: 13px 20px;
        color: var(--muted);
        font-size: 11px;
        display: flex;
        justify-content: space-between;
      }
      .empty-state {
        text-align: center;
        color: var(--muted);
        padding: 35px;
      }
      .modeB .workspace {
        padding: 22px 24px 120px;
      }
      .modeB .sidebar {
        width: 76px;
        padding: 25px 12px;
      }
      .modeB .app {
        grid-template-columns: 76px minmax(0, 1fr);
      }
      .modeB .sidebar .navlabel,
      .modeB .sidebar .eyebrow,
      .modeB .brandtext,
      .modeB .accounttext {
        display: none;
      }
      .modeB .brand {
        padding: 0;
        justify-content: center;
      }
      .modeB .sidebar .navitem {
        justify-content: center;
        padding: 13px;
      }
      .modeB .sidebottom {
        padding: 15px 10px 90px;
      }
      .modeB .pagehead {
        margin-bottom: 18px;
      }
      .canvaslayout {
        display: grid;
        grid-template-columns: 128px minmax(0, 1fr);
        gap: 0;
        min-height: 610px;
      }
      .floorrail {
        background: #19211c;
        border-right: 1px solid var(--border);
        padding: 18px 10px;
        display: flex;
        flex-direction: column;
        gap: 15px;
      }
      .floorcard {
        border: 1px solid #73895c;
        border-radius: 7px;
        background: #303f28;
        color: var(--accent);
        padding: 10px;
        width: 100%;
        text-align: left;
      }
      .floorcard strong {
        display: block;
        font-size: 14px;
      }
      .floorcard small {
        display: block;
        color: #b6c7aa;
        margin-top: 4px;
        font-size: 11px;
      }
      .floorsketch {
        height: 62px;
        display: grid;
        place-items: center;
        border-top: 1px solid #536647;
        margin-top: 12px;
      }
      .floorsketch div {
        height: 45px;
        width: 21px;
        background: #a4bb84;
        border: 3px double #344b25;
        transform: rotate(-15deg);
      }
      .railfooter {
        margin-top: auto;
      }
      .expansive {
        position: relative;
        min-width: 0;
      }
      .expansive .mapcanvas {
        min-height: 554px;
      }
      .expansive .mapcanvas svg.plan {
        height: 530px;
        margin-right: 245px;
      }
      .floatingdetail {
        position: absolute;
        right: 18px;
        top: 77px;
        width: 260px;
        box-shadow: 0 20px 60px #0006;
      }
      .floatingdetail .inner {
        padding: 18px;
      }
      .floatingdetail .locationglyph {
        display: none;
      }
      .floatingdetail .metrics {
        margin: 19px 0;
        gap: 12px;
      }
      .floatingdetail .inspectorfooter {
        padding: 14px 18px;
      }
      .floatingdetail .smallnote {
        display: none;
      }
      .maphint [data-action="floor-edit"] {
        display: none;
      }
      .maphint {
        margin-top: 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 11px;
        color: var(--muted);
      }
      .modeC .pagehead {
        margin-bottom: 22px;
      }
      .statstrip {
        display: flex;
        gap: 34px;
        margin-bottom: 25px;
        padding-bottom: 23px;
        border-bottom: 1px solid var(--border);
      }
      .statstrip strong {
        font-size: 24px;
        font-weight: 500;
        display: block;
      }
      .statstrip small {
        font-size: 11px;
      }
      .operations {
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(340px, 0.9fr);
        gap: 20px;
        align-items: start;
      }
      .operations .inventory {
        margin-top: 0;
      }
      .operations .listtools {
        flex-wrap: wrap;
      }
      .operations td,
      .operations th {
        padding-left: 16px;
        padding-right: 16px;
      }
      .operations .mapcanvas {
        min-height: 340px;
      }
      .operations .mapcanvas svg.plan {
        height: 340px;
        min-height: 340px;
      }
      .operations .inspector {
        margin-top: 16px;
      }
      .operations .inspector .inner {
        padding: 18px 22px;
      }
      .operations .locationglyph {
        display: none;
      }
      .operations .metrics {
        display: flex;
        justify-content: space-between;
        margin: 18px 0 0;
        gap: 10px;
      }
      .operations .inventorymini,
      .operations .smallnote,
      .operations .divider {
        display: none;
      }
      .operations .inspectorfooter {
        display: flex;
        gap: 10px;
      }
      .operations .inspector h2 {
        font-size: 18px;
      }
      .operations .mapstamp {
        display: none;
      }
      .operations .mapbottom .legend {
        display: none;
      }
      .prototypebar {
        position: fixed;
        z-index: 20;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px;
        background: #e7eade;
        color: #222d1c;
        border: 1px solid #ffffffe0;
        border-radius: 12px;
        box-shadow: 0 12px 60px #0008;
        max-width: calc(100% - 24px);
      }
      .prototypebar button {
        background: transparent;
        color: inherit;
        border: 0;
        border-radius: 7px;
        min-height: 39px;
        padding: 8px 14px;
        white-space: nowrap;
        font-size: 12px;
      }
      .prototypebar button.active {
        background: #23351f;
        color: #def0bd;
      }
      .prototypebar .protoinfo {
        padding: 0 12px;
        border-right: 1px solid #b8c0ae;
        margin-right: 3px;
        min-width: 170px;
      }
      .protoinfo strong {
        display: block;
        font-size: 11px;
      }
      .protoinfo span {
        display: block;
        font-size: 9px;
        color: #697360;
      }
      .prototypebar .arrow {
        padding: 8px;
      }
      .toast {
        position: fixed;
        bottom: 95px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 40;
        background: var(--accent);
        color: var(--ink);
        padding: 12px 22px;
        border-radius: 8px;
        box-shadow: 0 8px 40px #0005;
        font-size: 13px;
      }
      .toast[hidden] {
        display: none;
      }
      dialog {
        width: min(440px, calc(100% - 32px));
        background: var(--panel);
        color: var(--text);
        border: 1px solid #627259;
        border-radius: 12px;
        padding: 25px;
        box-shadow: 0 30px 100px #0008;
      }
      dialog::backdrop {
        background: #060c09bb;
        backdrop-filter: blur(4px);
      }
      dialog h2 {
        font-size: 21px;
        margin-bottom: 8px;
      }
      dialog p {
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 22px;
      }
      dialog label {
        display: grid;
        gap: 6px;
        font-size: 12px;
        margin: 15px 0;
      }
      dialog input {
        padding: 11px;
        background: #111a14;
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 6px;
        width: 100%;
      }
      .dialogactions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 24px;
      }
      .displayoptions {
        display: grid;
        gap: 12px;
        padding: 5px 0;
      }
      .displayoptions label {
        display: flex;
        gap: 10px;
        align-items: center;
        margin: 0;
      }
      .displayoptions input {
        width: 18px;
        accent-color: var(--accent);
      }
      .decision {
        padding: 11px 0 0;
        font-size: 11px;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 7px;
      }

              menu(
                "จัดการ " + esc(z.id),
                "การดำเนินการใช้กับจุดจัดเก็บนี้เท่านั้น",
                btn("ดูรหัสตำแหน่ง", "location-code", "scan") +
                  btn("เก็บถาวรจุดจัดเก็บ", "archive", "box", "danger"),
              );
            break;
          case "location-code":
            document.getElementById("dialog").close();
            if (z)
              menu(
                "รหัสตำแหน่ง",
                "รหัสสำหรับจุดจัดเก็บที่เลือก",
                `<div class="inventorymini mono" style="font-size:24px;text-align:center">${esc(z.id)}</div>`,
              );
            break;
          case "location-edit":
            document.getElementById("location-sheet").close();
            if (!z) break;
            openDialog(
              "แก้ไข " + esc(z.id),
              "การบันทึกนี้เปลี่ยนเฉพาะจุดจัดเก็บที่เลือก",
              `<label>ชื่อจุดจัดเก็บ<input name="name" required maxlength="60" value="${esc(z.name)}"></label><div class="row"><label>ความกว้าง (ม.)<input name="width" type="number" min="0.1" max="12.26" step="0.1" value="${z.width}" required></label><label>ความลึก (ม.)<input name="depth" type="number" min="0.1" max="29.9" step="0.1" value="${z.depth}" required></label></div>`,
              "บันทึกจุดจัดเก็บ",
              (f) => {
                z.name = f.get("name");
                z.width = Number(f.get("width"));
                z.depth = Number(f.get("depth"));
                render();
                notify("บันทึก " + z.id + " ในตัวอย่างแล้ว");
              },
            );
            break;
          case "archive":
            document.getElementById("dialog").close();
            if (z)
              openDialog(
                "เก็บถาวร " + esc(z.id) + "?",
                z.occupied
                  ? "จุดนี้มีสินค้าอยู่ จึงยังไม่สามารถเก็บถาวรได้"
                  : "จุดนี้จะหายจากรายการและแผนผังในตัวอย่างนี้",
                z.occupied
                  ? '<div class="inventorymini">ย้ายสินค้าออกก่อนเก็บถาวร</div>'
                  : "",
                z.occupied ? null : "ยืนยันเก็บถาวร",
                () => {
                  z.archived = true;
                  selected = visibleZones()[0]?.id;
                  render();
                  notify("เก็บถาวร " + z.id + " ในตัวอย่างแล้ว");
                },
              );
            break;
          case "add":
            openDialog(
              "เพิ่มจุดจัดเก็บ",
              "เพิ่มจุดจัดเก็บตัวอย่างในชั้น 1",
              `<label>รหัสจุดจัดเก็บ<input name="code" value="FG1-R${String(zones.length - 4).padStart(2, "0")}" pattern="[A-Za-z0-9-]+" required maxlength="20"></label><label>ชื่อจุดจัดเก็บ<input name="name" required value="จุดจัดเก็บใหม่" maxlength="60"></label>`,
              "เพิ่มจุดจัดเก็บ",
              (f) => {
                const id = f.get("code").toUpperCase();
                if (zones.some((x) => x.id === id)) {
                  notify("รหัสนี้มีอยู่แล้ว");
                  return false;
                }
                zones.push({
                  id,
                  name: f.get("name"),
                  occupied: false,
                  width: 2.4,
                  depth: 3.2,
                });
                selected = id;
                render();
                notify("เพิ่มจุดจัดเก็บในตัวอย่างแล้ว");
              },
            );
            break;
          case "show-list":
            if (isMobile() && variant === "B") {
              mobileView = "list";
              render();
              document.getElementById("search")?.focus({ preventScroll: true });
              break;
            }
            document
              .querySelector(".inventory")
              .scrollIntoView({ behavior: "smooth", block: "start" });
            break;
        }
      }
      document.addEventListener("click", (e) => {
        const v = e.target.closest("[data-variant]");
        if (v) {
          changeVariant(v.dataset.variant);
          return;
        }
        const s = e.target.closest("[data-select]");
        if (s) {
          selectLocation(s.dataset.select, s.classList.contains("zone"));
          return;
        }
        const b = e.target.closest("[data-action]");
        if (b) action(b.dataset.action);
      });
      document.addEventListener("input", (e) => {
        if (e.target.id === "search") {
          query = e.target.value;
          document.getElementById("table-content").innerHTML = table();
        }
      });
      document.addEventListener("change", (e) => {
        if (e.target.id === "filter") {
          filter = e.target.value;
          document.getElementById("table-content").innerHTML = table();
        }
      });
      document.addEventListener("keydown", (e) => {
        if (
          document.getElementById("dialog").open ||
          document.getElementById("location-sheet").open ||
          e.target.closest('input,textarea,select,[contenteditable="true"]')
        )
          return;
        const zone = e.target.closest("[data-select]");
        if (zone && (e.key === "Enter" || e.key === " ")) {
          e.preventDefault();
          selectLocation(zone.dataset.select, zone.classList.contains("zone"));
          return;
        }
        if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
          e.preventDefault();
          action(e.key === "ArrowLeft" ? "prev" : "next");
        }
      });
      matchMedia("(max-width: 580px)").addEventListener("change", (e) => {
        if (!e.matches) document.getElementById("location-sheet").close();
      });
      render();
    </script>
  </body>
</html>
