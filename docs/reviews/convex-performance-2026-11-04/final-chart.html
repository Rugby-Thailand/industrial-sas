<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Convex measured performance</title>
    <style>
      :root {
        font-family: var(--font-sans, system-ui);
        color: var(--foreground, #e5e7eb);
        font-size: 14px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        margin-bottom: 18px;
      }
      select {
        font: inherit;
        color: var(--foreground, #e5e7eb);
        background: var(--secondary, #242830);
        border: 1px solid var(--border, #414753);
        border-radius: var(--radius, 8px);
        padding: 7px 10px;
      }
      .legend {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        color: var(--muted-foreground, #a9b2c0);
        font-size: 12px;
      }
      .dot {
        display: inline-block;
        width: 9px;
        height: 9px;
        border-radius: 2px;
        margin-right: 5px;
      }
      .before {
        background: var(--chart-2, #9197a6);
      }
      .after {
        background: var(--chart-1, #66b8a2);
      }
      .row {
        margin: 18px 0 24px;
      }
      .label {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 10px;
      }
      .label strong {
        font-weight: 600;
      }
      .reduction {
        white-space: nowrap;
        font-family: var(--font-mono, monospace);
        color: var(--success, #7ac5aa);
      }
      .barline {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 90px;
        gap: 12px;
        align-items: center;
        margin: 5px 0;
      }
      .track {
        height: 13px;
        background: var(--secondary, #242830);
        border-radius: 3px;
        overflow: hidden;
      }
      .bar {
        height: 13px;
        border-radius: 3px;
        min-width: 2px;
      }
      .value {
        font-variant-numeric: tabular-nums;
        text-align: right;
      }
      .note {
        color: var(--muted-foreground, #a9b2c0);
        font-size: 12px;
        line-height: 1.6;
      }
      @media (max-width: 420px) {
        .label {
          font-size: 13px;
        }
        .barline {
          grid-template-columns: minmax(0, 1fr) 72px;
        }
      }
    </style>
  </head>
  <body>
    <div class="controls">
      <label for="metric">เปรียบเทียบ</label
      ><select id="metric">
        <option value="readDocs">Documents read</option>
        <option value="readBytes">KiB read</option>
        <option value="execMsP50">Local execution p50 (ms)</option>
      </select>
      <div class="legend">
        <span><i class="dot before"></i>main baseline</span
        ><span><i class="dot after"></i>iteration 10</span>
      </div>
    </div>
    <div id="chart" aria-live="polite"></div>
    <p class="note">
      ข้อมูลจริงจาก local Convex engine · 7 samples หลัง warmup · restore
      dataset เดียวกัน<br />แต่ละแถวมีสเกลของตัวเองและแสดงค่าจริงด้านขวา ·
      latency ผันผวนตามโหลดเครื่อง จึงไม่ใช่คำรับประกัน production<br />ต้นทาง:
      evidence/iter10.json · baseline 80dc0a93 · backend c4ff5087
    </p>
    <script>
      const data = [
        {
          title: "Put-away recommendations (current list)",
          function: "finishedGoods/workflow:recommend",
          label: "list",
          baseline: {
            n: 7,
            errors: 0,
            occRetries: 0,
            execMsP50: 424.53,
            execMsP95: 1007.06,
            userExecMsP50: 113.32,
            rttMsP50: 429.8,
            readDocs: 2886,
            readBytes: 1861485,
            writeDocs: 0,
            writeBytes: 0,
            writeIndexRows: 0,
            returnBytes: 244011,
            memoryMb: 64,
            requests: 1,
          },
          final: {
            n: 7,
            errors: 0,
            occRetries: 0,
            execMsP50: 112.65,
            execMsP95: 132.26,
            userExecMsP50: 54.16,
            rttMsP50: 116.53,
            readDocs: 438,
            readBytes: 764830,
            writeDocs: 0,
            writeBytes: 0,
            writeIndexRows: 0,
            returnBytes: 130786,
            memoryMb: 64,
            requests: 1,
          },
        },
        {
          title: "Saved-scan search",
          function: "finishedGoods/jobScans:listJobScans",
          label: "search",
          baseline: {
            n: 7,
            errors: 0,
            occRetries: 0,
            execMsP50: 644.95,
            execMsP95: 839.85,
            userExecMsP50: 248.9,
            rttMsP50: 711.33,
            readDocs: 2389,
            readBytes: 1578096,
            writeDocs: 0,
            writeBytes: 0,
            writeIndexRows: 0,
            returnBytes: 21981,
            memoryMb: 64,
            requests: 22,
          },
          final: {
            n: 7,
            errors: 0,
            occRetries: 0,
            execMsP50: 98.44,
            execMsP95: 334.36,
            userExecMsP50: 19.88,
            rttMsP50: 102.35,
            readDocs: 61,
            readBytes: 27089,
            writeDocs: 0,
            writeBytes: 0,
            writeIndexRows: 0,
            returnBytes: 3894,
            memoryMb: 64,
            requests: 1,
          },
        },
        {
          title: "Building inventory",
          function: "storageLayouts/catalogue:getStorageBuildingInventory",
          label: "",
          baseline: {
            n: 7,
            errors: 0,
            occRetries: 0,
            execMsP50: 260.95,
            execMsP95: 565.58,
            userExecMsP50: 61.72,
            rttMsP50: 268.02,
            readDocs: 1829,
            readBytes: 1348974,
            writeDocs: 0,
            writeBytes: 0,
            writeIndexRows: 0,
            returnBytes: 458594,
            memoryMb: 64,
            requests: 1,
          },
          final: {
            n: 7,
            errors: 0,
            occRetries: 0,
            execMsP50: 53.87,
            execMsP95: 124.99,
            userExecMsP50: 33.38,
            rttMsP50: 61.36,
            readDocs: 35,
            readBytes: 480676,
            writeDocs: 0,
            writeBytes: 0,
            writeIndexRows: 0,
            returnBytes: 458594,
            memoryMb: 64,
            requests: 1,
          },
        },
        {
          title: "Catalogue totals",
          function: "finishedGoods/catalogue:summary",
          label: "",
          baseline: {
            n: 7,
            errors: 0,
            occRetries: 0,
            execMsP50: 68.69,
            execMsP95: 276.53,
            userExecMsP50: 33.33,
            rttMsP50: 74.82,
            readDocs: 272,
            readBytes: 140166,
            writeDocs: 0,
            writeBytes: 0,
            writeIndexRows: 0,
            returnBytes: 1616,
            memoryMb: 64,
            requests: 2,
          },
          final: {
            n: 7,
            errors: 0,
            occRetries: 0,
            execMsP50: 18.05,
            execMsP95: 37.45,
            userExecMsP50: 12.71,
            rttMsP50: 21.52,
            readDocs: 18,
            readBytes: 7076,
            writeDocs: 0,
            writeBytes: 0,
            writeIndexRows: 0,
            returnBytes: 301,
            memoryMb: 64,
            requests: 1,
          },
        },
      ];
      function draw() {
        const key = document.getElementById("metric").value;
        const div = key === "readBytes" ? 1024 : 1;
        const fmt = (n) =>
          new Intl.NumberFormat("en-US", {
            maximumFractionDigits: key === "readDocs" ? 0 : 2,
          }).format(n / div);
        const chart = document.getElementById("chart");
        chart.replaceChildren();
        for (const r of data) {
          const b = r.baseline[key],
            a = r.final[key],
            max = Math.max(b, a);
          const row = document.createElement("div");
          row.className = "row";
          const label = document.createElement("div");
          label.className = "label";
          const title = document.createElement("strong");
          title.textContent = r.title;
          const pct = document.createElement("span");
          pct.className = "reduction";
          pct.textContent = "−" + ((1 - a / b) * 100).toFixed(1) + "%";
          label.append(title, pct);
          row.append(label);
          for (const [value, kind, name] of [
            [b, "before", "Baseline"],
            [a, "after", "Iteration 10"],
          ]) {
            const line = document.createElement("div");
            line.className = "barline";
            line.setAttribute("aria-label", name + ": " + fmt(value));
            const track = document.createElement("div");
            track.className = "track";
            const bar = document.createElement("div");
            bar.className = "bar " + kind;
            bar.style.width = (100 * value) / max + "%";
            track.append(bar);
            const number = document.createElement("span");
            number.className = "value";
            number.textContent = fmt(value);
            line.append(track, number);
            row.append(line);
          }
          chart.append(row);
        }
      }
      document.getElementById("metric").addEventListener("change", draw);
      draw();
    </script>
  </body>
</html>
