<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>อาคาร PD · Storage Planner preview</title>
    <style>
      @font-face {
        font-family: Geist;
        src: url(fonts/geist-latin.woff2) format("woff2");
        font-display: swap;
      }
      @font-face {
        font-family: Thai;
        src: url(fonts/noto-sans-thai.ttf) format("truetype");
        font-display: swap;
      }
      :root {
        --canvas: #f7f8fa;
        --surface: #fff;
        --raised: #eef0f3;
        --text: #20242c;
        --muted: #596170;
        --border: #dce0e6;
        --edge: #8b939f;
        --accent: #2444cf;
        --selected: #edf1ff;
        --link: #2444cf;
        --green: #16613e;
        --green-bg: #edf6f0;
        --amber: #86530b;
        --amber-bg: #fff5df;
        --purple: #63409b;
        --purple-bg: #f5eefc;
        --danger: #af3029;
        --shadow: 0 12px 40px #13243d24;
        --aisle: #e5e8ed;
        color-scheme: light;
      }
      :root.dark {
        --canvas: #101215;
        --surface: #191c21;
        --raised: #262a31;
        --text: #eef0f5;
        --muted: #b0b7c3;
        --border: #383e48;
        --edge: #818b9b;
        --accent: #4768e8;
        --selected: #253252;
        --link: #a7b9ff;
        --green: #91d8b0;
        --green-bg: #213b2c;
        --amber: #f3cc7e;
        --amber-bg: #44351c;
        --purple: #d3b1ff;
        --purple-bg: #382844;
        --danger: #ffaaa4;
        --shadow: 0 12px 40px #0006;
        --aisle: #353b44;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--canvas);
        color: var(--text);
        font:
          14px/1.5 Geist,
          Thai,
          system-ui,
          sans-serif;
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }
      button,
      select {
        cursor: pointer;
      }
      button {
        min-height: 36px;
        padding: 7px 12px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--surface);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        white-space: nowrap;
        font-weight: 500;
      }
      button:hover {
        background: var(--raised);
        border-color: var(--edge);
      }
      button:active {
        transform: translateY(1px);
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
        transform: none;
      }
      button.primary {
        background: var(--accent);
        color: white;
        border-color: var(--accent);
      }
      button.primary:hover {
        filter: brightness(1.12);
      }
      button.quiet {
        border-color: transparent;
        background: transparent;
      }
      button.selected,
      button[aria-pressed="true"] {
        background: var(--selected);
        border-color: var(--link);
        color: var(--link);
      }
      a {
        color: var(--link);
        text-underline-offset: 3px;
      }
      input,
      select {
        min-height: 36px;
        border: 1px solid var(--edge);
        border-radius: 6px;
        padding: 7px 10px;
        background: var(--surface);
        min-width: 0;
      }
      input::placeholder {
        color: var(--muted);
        opacity: 1;
      }
      input {
        caret-color: var(--link);
      }
      :focus-visible {
        outline: 3px solid var(--link);
        outline-offset: 3px;
      }
      ::selection {
        color: var(--text);
        background: var(--selected);
      }
      svg.icon {
        width: 17px;
        height: 17px;
        stroke: currentColor;
        stroke-width: 1.7;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex: none;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 22px;
        letter-spacing: -0.025em;
        line-height: 1.4;
        font-weight: 650;
      }
      h2 {
        font-size: 17px;
        font-weight: 600;
      }
      h3 {
        font-size: 15px;
        font-weight: 600;
      }
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 12px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .between {
        justify-content: space-between;
      }
      .wrap {
        flex-wrap: wrap;
      }
      .grow {
        flex: 1;
      }
      .num {
        font-variant-numeric: tabular-nums;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 12px;
        font-weight: 500;
      }
      .badge:before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 2px;
        background: currentColor;
      }
      .badge.stored {
        color: var(--green);
      }
      .badge.reserved {
        color: var(--amber);
      }
      .badge.unknown {
        color: var(--purple);
      }
      .badge.empty {
        color: var(--muted);
      }
      .badge.empty:before {
        background: none;
        border: 1px solid currentColor;
      }
      .appbar {
        height: 43px;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
        padding: 0 28px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .mobile-demo {
        display: none;
      }
      .brand {
        font-size: 13px;
        font-weight: 650;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .brand .icon {
        color: var(--link);
      }
      .preview-tools {
        font-size: 12px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .preview-tools button {
        font-size: 12px;
        min-height: 30px;
        padding: 3px 8px;
      }
      .preview-tag {
        color: var(--muted);
      }
      main {
        max-width: 1600px;
        margin: auto;
        padding: 20px 28px 24px;
      }
      .pagehead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 14px;
      }
      .pagehead .meta {
        display: flex;
        gap: 12px;
        align-items: center;
        margin-top: 3px;
        color: var(--muted);
        font-size: 12px;
      }
      .tasknav {
        display: flex;
        border-bottom: 1px solid var(--border);
        gap: 24px;
        margin-bottom: 16px;
      }
      .tasknav button {
        border: 0;
        border-radius: 0;
        background: transparent;
        padding: 9px 1px 11px;
        position: relative;
        color: var(--muted);
      }
      .tasknav button[aria-pressed="true"] {
        color: var(--link);
      }
      .tasknav button[aria-pressed="true"]:after {
        position: absolute;
        bottom: -1px;
        left: 0;
        right: 0;
        height: 2px;
        background: var(--link);
        content: "";
      }
      .toolbar {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 10px;
      }
      .search {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: 1;
        max-width: 520px;
        border: 1px solid var(--edge);
        border-radius: 6px;
        padding-left: 10px;
        background: var(--surface);
      }
      .search input {
        border: 0;
        outline: none;
        width: 100%;
        padding-left: 0;
        background: transparent;
      }
      .search:focus-within {
        outline: 2px solid var(--link);
        outline-offset: 2px;
      }
      .search button {
        border: 0;
        min-height: 32px;
        padding: 4px 8px;
        margin-right: 2px;
      }
      .view-switch {
        display: flex;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--surface);
        padding: 2px;
        gap: 2px;
      }
      .view-switch button {
        border: 0;
        min-height: 30px;
        padding: 4px 12px;
      }
      .view-switch button[aria-pressed="true"] {
        background: var(--raised);
        color: var(--text);
      }
      .filters {
        display: flex;
        align-items: center;
        gap: 7px;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }
      .filters button {
        font-size: 12px;
        min-height: 30px;
        padding: 4px 9px;
        background: transparent;
        border-color: transparent;
      }
      .filters button[aria-pressed="true"] {
        background: var(--surface);
        border-color: var(--edge);
        color: var(--text);
      }
      .filters .count {
        color: var(--muted);
        margin-left: 4px;
      }
      .filter-result {
        margin-left: auto;
        font-size: 12px;
        color: var(--muted);
      }
      .workspace {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 18px;
        align-items: start;
      }
      .workspace.has-detail {
        grid-template-columns: minmax(0, 1fr) 302px;
      }
      .surface {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
      }
      .overview {
        padding: 12px 18px 8px;
        border-bottom: 1px solid var(--border);
      }
      .overview-title {
        font-size: 12px;
        color: var(--muted);
        display: flex;
        justify-content: space-between;
        margin-bottom: 7px;
      }
      .floor-overview {
        width: 100%;
        height: auto;
        max-height: 135px;
        display: block;
      }
      .groupnav {
        display: flex;
        gap: 5px;
        overflow: auto;
        padding: 9px 0 3px;
      }
      .groupnav button {
        font-size: 12px;
        min-width: 43px;
        min-height: 30px;
        padding: 4px 8px;
      }
      .group-head {
        padding: 14px 18px 10px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .group-head .spacer {
        flex: 1;
      }
      .group-select {
        font-weight: 600;
        max-width: 130px;
      }
      .camera button {
        min-height: 30px;
        padding: 3px 8px;
      }
      .map-scroll {
        overflow: auto;
        padding: 8px 18px 18px;
      }
      .position-grid {
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-width: 0;
      }
      .position-row {
        display: grid;
        gap: 8px;
      }
      .position {
        border: 1px solid var(--edge);
        border-radius: 5px;
        min-height: 62px;
        padding: 9px 5px;
        background: var(--surface);
        flex-direction: column;
        gap: 5px;
      }
      .position .code {
        font-size: 13px;
        font-weight: 650;
      }
      .position .cell-state {
        font-size: 11px;
        font-weight: 400;
        color: var(--muted);
      }
      .position.stored {
        background: var(--green-bg);
        border-color: color-mix(in srgb, var(--green) 48%, var(--border));
      }
      .position.reserved {
        background: var(--amber-bg);
        border-style: dashed;
        border-color: var(--amber);
      }
      .position.unknown {
        background: var(--purple-bg);
        border-color: var(--purple);
      }
      .position.is-selected {
        background: var(--selected);
        outline: 2px solid var(--link);
        outline-offset: 1px;
        color: var(--link);
      }
      .position.is-selected .cell-state {
        color: var(--link);
      }
      .position.filtered {
        opacity: 0.28;
      }
      .position.filtered:hover {
        opacity: 1;
      }
      .map-foot {
        padding: 10px 18px;
        border-top: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
        font-size: 12px;
        color: var(--muted);
      }
      .list-head {
        padding: 13px 18px;
        border-bottom: 1px solid var(--border);
      }
      .location-row {
        width: 100%;
        display: grid;
        grid-template-columns: minmax(110px, 1.15fr) 1fr 100px 65px 18px;
        text-align: left;
        gap: 12px;
        min-height: 57px;
        padding: 10px 18px;
        border: 0;
        border-bottom: 1px solid var(--border);
        border-radius: 0;
        font-weight: 400;
      }
      .location-row:last-child {
        border: 0;
      }
      .location-row .loc-code {
        font-weight: 600;
      }
      .location-row .icon {
        justify-self: end;
      }
      .location-row.is-selected {
        background: var(--selected);
      }
      .table-head {
        display: grid;
        grid-template-columns: minmax(110px, 1.15fr) 1fr 100px 65px 18px;
        gap: 12px;
        padding: 8px 18px;
        background: var(--canvas);
        border-bottom: 1px solid var(--border);
        font-size: 12px;
        color: var(--muted);
      }
      .pagination {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 18px;
        border-top: 1px solid var(--border);
        gap: 10px;
      }
      .details {
        position: sticky;
        top: 16px;
      }
      .detail-head {
        padding: 16px 18px 12px;
        border-bottom: 1px solid var(--border);
      }
      .detail-body {
        padding: 16px 18px;
      }
      .detail-body > section + section {
        margin-top: 22px;
      }
      .detail-body dl {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 9px;
        margin: 12px 0 0;
        font-size: 12px;
      }
      .detail-body dt {
        color: var(--muted);
      }
      .detail-body dd {
        margin: 0;
        text-align: right;
      }
      .detail-subtitle {
        margin-top: 3px;
        color: var(--muted);
        font-size: 12px;
      }
      .stock-unit {
        padding: 12px 0;
        border-bottom: 1px solid var(--border);
      }
      .stock-unit:last-child {
        border-bottom: 0;
      }
      .stock-unit .unit-code {
        font-weight: 600;
        font-size: 13px;
      }
      .stock-unit p {
        font-size: 12px;
        margin: 3px 0 8px;
        color: var(--muted);
      }
      .stock-unit button {
        font-size: 12px;
        min-height: 30px;
      }
      .detail-action {
        width: 100%;
        margin-top: 12px;
      }
      .notice {
        padding: 12px 15px;
        background: var(--selected);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        margin-bottom: 14px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .notice.warning {
        background: var(--amber-bg);
      }
      .notice p {
        font-size: 12px;
      }
      .notice .row {
        margin-left: auto;
      }
      .empty-state {
        padding: 55px 24px;
        text-align: center;
      }
      .empty-state h2 {
        margin-bottom: 8px;
      }
      .empty-state p {
        color: var(--muted);
        margin-bottom: 18px;
      }
      .help {
        font-size: 12px;
        color: var(--muted);
        margin-top: 8px;
        line-height: 1.65;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 5px;
        margin-top: 13px;
      }
      .field label {
        font-size: 12px;
        font-weight: 500;
      }
      .field input,
      .field select {
        width: 100%;
      }
      .error {
        color: var(--danger);
        font-size: 12px;
        margin: 8px 0;
      }
      .stock-tools {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 14px;
      }
      .stock-tools p {
        color: var(--muted);
        font-size: 12px;
        flex: 1;
      }
      .workflow {
        border-top: 1px solid var(--border);
        margin-top: 16px;
        padding-top: 16px;
      }
      .workflow h3 {
        margin-bottom: 8px;
      }
      .workflow .step {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 10px;
      }
      .flow-summary {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 12px;
        background: var(--raised);
        border-radius: 5px;
        font-size: 12px;
        margin: 12px 0;
      }
      .flow-summary strong {
        font-size: 14px;
      }
      .check {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        margin: 14px 0;
        font-size: 13px;
      }
      .check input {
        min-height: auto;
        margin-top: 4px;
        accent-color: var(--accent);
        width: 17px;
        height: 17px;
      }
      .dialog {
        padding: 0;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--surface);
        color: var(--text);
        max-width: min(510px, calc(100vw - 32px));
        width: 510px;
        max-height: 85dvh;
        box-shadow: var(--shadow);
      }
      .dialog::backdrop {
        background: #10182770;
      }
      .dialog-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 22px;
        border-bottom: 1px solid var(--border);
      }
      .dialog-body {
        padding: 20px 22px;
      }
      .dialog-body > p {
        color: var(--muted);
        font-size: 13px;
      }
      .dialog-actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        padding-top: 20px;
        flex-wrap: wrap;
      }
      .toast {
        position: fixed;
        bottom: 22px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--text);
        color: var(--surface);
        padding: 11px 18px;
        border-radius: 7px;
        z-index: 20;
        max-width: calc(100vw - 32px);
        font-size: 13px;
        box-shadow: var(--shadow);
      }
      [hidden] {
        display: none !important;
      }
      .pagefoot {
        margin-top: 18px;
        color: var(--muted);
        font-size: 11px;
        display: flex;
        justify-content: space-between;
        gap: 14px;
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .skip {
        position: fixed;
        top: -100px;
        left: 20px;
        padding: 10px;
        background: var(--surface);
        z-index: 99;
      }
      .skip:focus {
        top: 8px;
      }
      .dim {
        color: var(--muted);
        font-size: 12px;
      }
      .mode-help {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 10px;
      }
      .inline-link {
        font-size: 12px;
      }
      .dialog .details {
        border: 0;
        position: static;
      }
      .dialog .detail-head {
        padding: 16px 18px;
      }
      .dialog.sheet {
        max-height: 86dvh;
      }
      .action-stack {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 12px;
      }
      .pending-list button {
        display: flex;
        justify-content: space-between;
        width: 100%;
        margin-top: 10px;
        min-height: 60px;
        text-align: left;
      }
      .pending-list small {
        display: block;
        font-weight: 400;
        color: var(--muted);
      }
      @media (min-width: 1500px) {
        .workspace.has-detail {
          grid-template-columns: minmax(0, 1fr) 330px;
        }
        .position {
          min-height: 79px;
        }
        .floor-overview {
          max-height: 180px;
        }
      }
      @media (max-width: 1050px) {
        main {
          padding: 18px;
        }
        .appbar {
          padding: 0 18px;
        }
        .workspace.has-detail {
          grid-template-columns: minmax(0, 1fr) 280px;
        }
        .position .code {
          font-size: 11px;
        }
        .position .cell-state {
          font-size: 10px;
        }
        .position-grid,
        .position-row {
          gap: 6px;
        }
        .pagehead .meta .dimensions {
          display: none;
        }
        .toolbar {
          flex-wrap: wrap;
        }
        .search {
          max-width: none;
        }
        .view-switch {
          margin-left: auto;
        }
        .location-row,
        .table-head {
          grid-template-columns: minmax(95px, 1fr) 90px 65px 18px;
        }
        .location-row .loc-product,
        .table-head .product-heading {
          display: none;
        }
        .preview-tag .extra {
          display: none;
        }
      }
      @media (max-width: 760px) {
        .appbar {
          padding: 0 14px;
          height: 42px;
        }
        .brand {
          font-size: 12px;
        }
        .brand .mobile-demo {
          display: block;
          font-size: 10px;
          font-weight: 400;
          color: var(--muted);
          line-height: 1.4;
        }
        .brand .warehouse-label,
        .preview-tag,
        .preview-tools .reset-label {
          display: none;
        }
        .preview-tools {
          gap: 4px;
        }
        main {
          padding: 14px 12px 20px;
        }
        .pagehead {
          gap: 10px;
          align-items: flex-start;
          margin-bottom: 12px;
        }
        .pagehead .meta {
          gap: 7px;
          flex-wrap: wrap;
        }
        .pagehead h1 {
          font-size: 20px;
        }
        .pagehead .meta .dimensions {
          display: none;
        }
        .pagehead .settings-text {
          display: none;
        }
        .pagehead .head-actions {
          gap: 6px;
        }
        .pagehead select {
          width: 93px;
        }
        .tasknav {

        if (e.target.id !== "search-form") return;
        e.preventDefault();
        search = document.getElementById("search").value.trim();
        page = 0;
        const r = results();
        const exact = r.find(
          (p) =>
            p.code.toLowerCase() === search.toLowerCase() ||
            p.code.toLowerCase().slice(3) === search.toLowerCase(),
        );
        if (exact) {
          selected = exact.code;
          group = exact.group;
        } else if (r.length) group = r[0].group;
        render();
        if (exact) showDetails();
        announce(`${r.length} ${t("ตำแหน่ง", "locations")}`);
      });
      document.addEventListener("input", (e) => {
        if (!["edit-label", "edit-height"].includes(e.target.id) || !selected)
          return;
        const p = find(selected),
          name = activeInput("edit-label").value,
          height = activeInput("edit-height").value,
          id = e.target.id,
          start = e.target.selectionStart;
        drafts[selected] = {
          label: name,
          height: p.units.length ? p.heightMm / 1000 : height,
        };
        if (name === p.label && Number(height) === p.heightMm / 1000)
          delete drafts[selected];
        render();
        const input = activeInput(id);
        input?.focus();
        if (id === "edit-label" && start !== null)
          input?.setSelectionRange(start, start);
      });
      document.addEventListener("change", (e) => {
        if (e.target.id === "floor") {
          const target = Number(e.target.value);
          guard(() => {
            floor = target;
            selected = null;
            page = 0;
            closeSheet();
            render();
          });
          if (floor !== target) e.target.value = floor;
        } else if (e.target.id === "destination") {
          flow.target = e.target.value;
          render();
        } else if (e.target.id === "ack") {
          const root =
            e.target.closest("dialog") ||
            document.querySelector(".details.desktop");
          root
            ?.querySelector('[data-action="pickup"],[data-action="complete"]')
            ?.toggleAttribute("disabled", !e.target.checked);
        } else if (e.target.id === "return-ack") {
          document.querySelector('[data-action="confirm-return"]').disabled =
            !e.target.checked;
        }
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && !modal.open && !sheet.open && selected) {
          selected = null;
          render();
        }
        const b = e.target.closest(".position");
        if (
          b &&
          ["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(e.key)
        ) {
          const all = [
              ...b.closest(".position-grid").querySelectorAll("button"),
            ],
            cols = group === 1 ? 5 : 7;
          let i =
            all.indexOf(b) +
            { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -cols, ArrowDown: cols }[
              e.key
            ];
          all[Math.max(0, Math.min(all.length - 1, i))].focus();
          e.preventDefault();
        }
      });
      window.addEventListener("beforeunload", (e) => {
        if (Object.keys(drafts).length || flow) {
          e.preventDefault();
          e.returnValue = "";
        }
      });
      let wasMobile = innerWidth <= 760;
      window.addEventListener("resize", () => {
        const mobile = innerWidth <= 760;
        if (mobile !== wasMobile) {
          wasMobile = mobile;
          closeSheet();
          render();
        }
      });
      try {
        const q = new URLSearchParams(location.search);
        if (["lookup", "operate", "edit"].includes(q.get("task")))
          task = q.get("task");
        if (["map", "list"].includes(q.get("panel"))) view = q.get("panel");
        if (q.get("floor") === "2") {
          floor = 2;
          selected = null;
        }
      } catch {}
      render();
    </script>
  </body>
</html>
