<style>html,body{margin:0;background:#0b0d11}</style>

  <style>
    #f1-semantic-zoom-review { box-sizing: border-box; width: 100%; padding: 20px; background: #0b0d11; color: #f6f7f8; font-family: Tahoma, "Noto Sans Thai", sans-serif; }
    #f1-semantic-zoom-review * { box-sizing: border-box; }
    #f1-semantic-zoom-review .head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
    #f1-semantic-zoom-review h2 { margin: 0; font-size: 23px; font-weight: 700; }
    #f1-semantic-zoom-review .sub { margin-top: 4px; color: #bac3ca; font-size: 14px; }
    #f1-semantic-zoom-review .controls { display: flex; gap: 8px; align-items: center; }
    #f1-semantic-zoom-review button { font: inherit; }
    #f1-semantic-zoom-review .zoom-btn { min-height: 40px; padding: 7px 14px; background: #26313b; color: #f6f7f8; border: 1px solid #657682; border-radius: 8px; }
    #f1-semantic-zoom-review .zoom-btn:disabled { opacity: .45; }
    #f1-semantic-zoom-review .stage { border: 1px solid #415361; border-radius: 16px; overflow: hidden; background: #0e141a; }
    #f1-semantic-zoom-review svg { width: 100%; height: auto; display: block; }
    #f1-semantic-zoom-review .f1-overview-group { outline: none; }

    #f1-semantic-zoom-review .detail { padding: 18px 22px 22px; min-height: 540px; }
    #f1-semantic-zoom-review .detail-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; }
    #f1-semantic-zoom-review .detail-title { font-size: 21px; font-weight: 700; }
    #f1-semantic-zoom-review .detail-count { color: #bac3ca; font-size: 14px; }
    #f1-semantic-zoom-review .slot-layout { display: flex; width: min(100%, 920px); height: 450px; margin: auto; }
    #f1-semantic-zoom-review .slot-layout.aisle-left { flex-direction: row-reverse; }
    #f1-semantic-zoom-review .slot-grid { display: grid; gap: 2px; flex: 1; min-width: 0; height: 100%; border: 2px solid #69dcb0; background: #263c36; }
    #f1-semantic-zoom-review .micro-aisle { flex: 0 0 44px; display: flex; align-items: center; justify-content: center; background: #f0a778; color: #372115; font-size: 13px; font-weight: 700; writing-mode: vertical-rl; text-orientation: mixed; }
    #f1-semantic-zoom-review .slot { min-width: 0; min-height: 0; padding: 4px; border: 1px dashed #86bca7; background: #d8e5df; color: #1c2d31; font-size: clamp(11px, 1.1vw, 16px); font-weight: 600; overflow: hidden; text-overflow: clip; white-space: nowrap; }

    #f1-semantic-zoom-review .slot.selected { background: #9fe5c1; outline: 2px solid #19aa76; outline-offset: -2px; }
    #f1-semantic-zoom-review .detail-foot { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-top: 12px; color: #bfcbd0; font-size: 14px; }
    #f1-semantic-zoom-review .legend { display: flex; gap: 22px; flex-wrap: wrap; padding: 12px 4px 0; color: #bcc7cd; font-size: 13px; }
    #f1-semantic-zoom-review .swatch { display: inline-block; width: 14px; height: 14px; margin-right: 6px; vertical-align: -2px; }
    @media (max-width: 700px) { #f1-semantic-zoom-review { padding: 10px; } #f1-semantic-zoom-review .detail { padding: 12px; min-height: 450px; } #f1-semantic-zoom-review .slot-layout { height: 360px; } #f1-semantic-zoom-review .slot { font-size: 11px; writing-mode: vertical-rl; text-orientation: mixed; } }

  <div class="legend"><span><i class="swatch" style="background:#17372b;border:1px solid #67deb0"></i>กลุ่มจุดจัดเก็บ</span><span><i class="swatch" style="background:#f0a778"></i>ทางเดินแนวตั้ง 0.30 ม.</span><span><i class="swatch" style="background:#a6613e"></i>ทางเดินระหว่างแถว</span><span><i class="swatch" style="background:#ff7479"></i>F1-L03 มีหมายเหตุหน้าประตู</span></div>
  <script>
    (() => {
      const root = document.getElementById("f1-semantic-zoom-review");
      const source = {"counts":{"1":6,"2":6,"3":12,"4":6,"5":6,"6":6,"7":6,"8":6,"9":4,"10":6,"11":6,"12":6,"13":3,"14":6,"15":6,"16":6,"17":6,"18":28,"19":18,"20":18,"21":18,"22":18,"23":18,"24":18,"25":18,"26":18,"27":9,"28":18,"29":9,"30":18,"31":19},"groups":[{"number":31,"code":"F1-L31"},{"number":30,"code":"F1-L30"},{"number":29,"code":"F1-L29"},{"number":28,"code":"F1-L28"},{"number":27,"code":"F1-L27"},{"number":26,"code":"F1-L26"},{"number":25,"code":"F1-L25"},{"number":24,"code":"F1-L24"},{"number":23,"code":"F1-L23"},{"number":22,"code":"F1-L22"},{"number":21,"code":"F1-L21"},{"number":20,"code":"F1-L20"},{"number":19,"code":"F1-L19"},{"number":18,"code":"F1-L18"},{"number":17,"code":"F1-L17"},{"number":16,"code":"F1-L16"},{"number":15,"code":"F1-L15"},{"number":14,"code":"F1-L14"},{"number":13,"code":"F1-L13"},{"number":12,"code":"F1-L12"},{"number":11,"code":"F1-L11"},{"number":10,"code":"F1-L10"},{"number":9,"code":"F1-L9"},{"number":8,"code":"F1-L8"},{"number":7,"code":"F1-L7"},{"number":6,"code":"F1-L6"},{"number":5,"code":"F1-L5"},{"number":4,"code":"F1-L4"},{"number":3,"code":"F1-L3"},{"number":2,"code":"F1-L2"},{"number":1,"code":"F1-L1"}]};
      const $ = (id) => root.querySelector("#" + id);
      let selectedGroup = 17;
      let selectedSlot = "";
      function layout(number) {
        const n = Number(number), count = source.counts[n];
        const result = [];
        const put = (num, col, row) => result.push({ code: "F1-L" + n + "-" + num, col, row });
        let cols, rows;
        if (n === 31) {
          cols = 3; rows = 9;
          for (let i = 0; i < 5; i++) { put(19 - i, 1, i + 1); put(14 - i, 2, i + 1); }
          for (let i = 0; i < 9; i++) put(9 - i, 3, i + 1);
        } else if (n === 18) {
          cols = 4; rows = 9;
          for (let i = 0; i < 9; i++) { put(28 - i, 1, i + 1); put(19 - i, 2, i + 1); }
          for (let i = 0; i < 5; i++) { put(10 - i, 3, i + 1); put(5 - i, 4, i + 1); }
        } else if (n >= 18 && count === 18) {
          cols = 2; rows = 9;
          for (let i = 0; i < 9; i++) { put(18 - i, 1, i + 1); put(9 - i, 2, i + 1); }
        } else if (n >= 18 && count === 9) {
          cols = 1; rows = 9;
          for (let i = 0; i < 9; i++) put(9 - i, 1, i + 1);
        } else if (count === 12) {
          cols = 4; rows = 3;
          for (let col = 1; col <= 4; col++) for (let row = 1; row <= 3; row++) put((4 - col) * 3 + row, col, row);
        } else if (count === 6) {
          cols = 2; rows = 3;
          for (let row = 1; row <= 3; row++) { put(row + 3, 1, row); put(row, 2, row); }
        } else if (count === 4) {
          cols = 2; rows = 2;
          for (let row = 1; row <= 2; row++) { put(row + 2, 1, row); put(row, 2, row); }
        } else {
          cols = 1; rows = 3;
          for (let row = 1; row <= 3; row++) put(row, 1, row);
        }
        return { cols, rows, slots: result };
      }
      function showDetail(number) {
        selectedGroup = Number(number);
        selectedSlot = "";
        const { cols, rows, slots } = layout(selectedGroup);
        $("f1-overview").hidden = true;
        $("f1-detail").hidden = false;
        $("f1-zoom-out").disabled = false;
        $("f1-zoom-in").disabled = true;
        $("f1-zoom-sub").textContent = "ซูมเข้าแล้ว · เห็นรหัสช่องย่อยตรงตาม PDF หน้า 3";
        $("f1-detail-title").textContent = "F1-L" + selectedGroup;
        $("f1-detail-count").textContent = slots.length + " ช่องย่อย";
        $("f1-selected-slot").textContent = "เลือกช่องย่อยเพื่อดูรหัสเต็ม";
        $("f1-slot-layout").classList.toggle("aisle-left", selectedGroup === 1 || selectedGroup === 18);
        const grid = $("f1-slot-grid");
        grid.style.gridTemplateColumns = "repeat(" + cols + ", minmax(0, 1fr))";
        grid.style.gridTemplateRows = "repeat(" + rows + ", minmax(0, 1fr))";
        grid.replaceChildren();
        for (const slot of slots) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "slot";
          button.textContent = slot.code;
          button.style.gridColumn = String(slot.col);
          button.style.gridRow = String(slot.row);
          button.setAttribute("aria-label", "เลือกช่อง " + slot.code);
          button.addEventListener("click", () => {
            grid.querySelectorAll(".slot.selected").forEach((item) => item.classList.remove("selected"));
            button.classList.add("selected");
            selectedSlot = slot.code;
            $("f1-selected-slot").textContent = "ช่องที่เลือก: " + selectedSlot;
          });
          grid.append(button);
        }
      }
      function showOverview() {
        $("f1-overview").hidden = false;
        $("f1-detail").hidden = true;
        $("f1-zoom-out").disabled = true;
        $("f1-zoom-in").disabled = false;
        $("f1-zoom-sub").textContent = "ภาพรวมแสดงระดับกลุ่ม · เลือกกลุ่มหรือกด + เพื่อดูช่องย่อย";
      }
      $("f1-zoom-in").addEventListener("click", () => showDetail(selectedGroup));
      $("f1-zoom-out").addEventListener("click", showOverview);
      root.querySelectorAll(".f1-overview-group").forEach((group) => {
        const open = () => showDetail(group.dataset.group);
        group.addEventListener("click", open);
        group.addEventListener("keydown", (event) => { if (event.key === "Enter" || event.key === " ") { event.preventDefault(); open(); } });
      });
    })();
  </script>
