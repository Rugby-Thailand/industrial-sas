<script>(()=>{const root=document.getElementById("f2-zoom"),$=id=>root.querySelector("#"+id);const counts={"1":35,"2":5,"3":10,"4":10,"5":10,"6":10,"7":10,"8":10,"9":10,"10":10,"11":10,"12":6,"13":4,"14":4,"15":4,"16":5};let active="F2-L10";function layout(code){const shelf=code.includes("-S"),rack=code.includes("-R-");if(shelf)return{shelf,cols:1,rows:1,codes:[code]};const n=Number(code.match(/L([0-9]+)$/)[1]);if(rack)return{rack,cols:1,rows:3,codes:[3,2,1].map(i=>code+"-"+i+"-0")};if(n===1)return{cols:35,rows:1,codes:Array.from({length:35},(_,i)=>code+"-"+(35-i))};if(n===2||n===16)return{cols:1,rows:5,codes:[5,4,3,2,1].map(i=>code+"-"+i)};if(n>=13&&n<=15)return{cols:2,rows:2,codes:[4,2,3,1].map(i=>code+"-"+i)};if(n===12)return{cols:2,rows:3,codes:[6,3,5,2,4,1].map(i=>code+"-"+i)};return{cols:2,rows:5,codes:[10,5,9,4,8,3,7,2,6,1].map(i=>code+"-"+i)}}function open(code){active=code;const view=layout(code),shelf=!!view.shelf,rack=!!view.rack,long=code==="F2-L1";$("f2-overview").hidden=true;$("f2-detail").hidden=false;$("f2-out").disabled=false;$("f2-in").disabled=true;const detailLayout=$("f2-detail").querySelector(".detail-layout");detailLayout.classList.toggle("shelf-layout",shelf);detailLayout.classList.toggle("rack-layout",rack);detailLayout.querySelector(".aisle").hidden=rack||long;$("f2-sub").textContent=shelf?"ช่องสีฟ้า: รหัสเสนอใหม่":"ซูมเข้าแล้ว · ลำดับรหัสช่องตาม PDF หน้า 4";$("f2-title").textContent=code;$("f2-count").textContent=shelf?"ช่องสีฟ้า 1 ช่อง · รออนุมัติชื่อ":view.codes.length+" ช่องย่อย";$("f2-selected").textContent=shelf?"ช่องสีฟ้าที่เลือก: "+code:"เลือกช่องย่อยเพื่อดูรหัสเต็ม";$("f2-detail-note").textContent=shelf?"ทางเดินหน้า 0.30 ม.":long?"ลำดับช่องจริงเรียงตามแนวยาวจากซ้ายไปขวา":rack?"แร็ก 3 ระดับ · รหัสตาม PDF":"เส้นประแบ่งช่องย่อย · แถบส้มคั่นกลุ่ม";const grid=$("f2-slots");grid.replaceChildren();grid.classList.toggle("long-strip",long);grid.style.gridTemplateColumns="repeat("+view.cols+",minmax(0,1fr))";grid.style.gridTemplateRows="repeat("+view.rows+",minmax(0,1fr))";for(const slotCode of view.codes){const b=document.createElement("button");b.type="button";b.className="slot";b.textContent=slotCode;b.setAttribute("aria-label","เลือกช่อง "+slotCode);b.addEventListener("click",()=>{grid.querySelectorAll(".selected").forEach(x=>x.classList.remove("selected"));b.classList.add("selected");$("f2-selected").textContent="ช่องที่เลือก: "+slotCode});grid.append(b)}}function back(){$("f2-overview").hidden=false;$("f2-detail").hidden=true;$("f2-out").disabled=true;$("f2-in").disabled=false;$("f2-sub").textContent="ภาพรวมระดับกลุ่ม · เลือกกลุ่มหรือกด + เพื่อดูรหัสช่องย่อย"}$("f2-in").addEventListener("click",()=>open(active));$("f2-out").addEventListener("click",back);root.querySelectorAll(".group").forEach(g=>{const cb=()=>open(g.dataset.code);g.addEventListener("click",cb);g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();cb()}})})})();</script>
